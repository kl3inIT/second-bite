# The browser preview of the app: a preview for the team, never indexed and never offered to customers.
server {
    listen 8080;
    root /usr/share/nginx/html;
    # Behind the host's proxy this port is not the browser's, so a redirect names a path only.
    absolute_redirect off;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;

    # Flutter's files keep their names across builds, so the browser asks again each time instead of keeping an old app.
    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ @screen;
    }

    # The app reads its route after "#", Flutter's default on the web, so a link to a screen is sent there:
    # /mobile/account/settings opens settings instead of the home. The host's proxy serves this container at /mobile/
    # and strips that prefix, so the redirect puts it back.
    location @screen {
        return 302 /mobile/#$request_uri;
    }
}
