# The browser preview of the app: a preview for the team, never indexed and never offered to customers.
server {
    listen 8080;
    root /usr/share/nginx/html;

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;

    # Flutter's files keep their names across builds, so the browser asks again each time instead of keeping an old app.
    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
