name: app_ui
description: Second Bite's design system for Flutter, built from DESIGN.md.
version: 0.1.0+1
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ^3.47.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  # Lucide, the web's icon set (lucide-react). Held at one release and moved by
  # hand with the web's lucide-react, so a glyph renamed upstream changes in
  # both apps at once.
  lucide_icons_flutter: 4.0.1
  material_ui: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  # The licences of the typefaces, shown on the app's licence page.
  # The wordmark, "second bite" with the bitten "o", as Figma's logo/wordmark
  # (node 7:5639) exports it; the launch screens' rasters are drawn from it.
  assets:
    - assets/brand/wordmark.svg
    # Google's "G" from its sign-in branding kit, for AppGoogleButton.
    - assets/brand/google-g.svg
    - assets/fonts/BeVietnamPro-OFL.txt
    - assets/fonts/BricolageGrotesque-OFL.txt
  # DESIGN.md's typefaces with the Vietnamese marks, from Google Fonts under the
  # SIL Open Font License. Bricolage Grotesque is the variable font.
  fonts:
    - family: Be Vietnam Pro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
    - family: Bricolage Grotesque
      fonts:
        - asset: assets/fonts/BricolageGrotesque-Variable.ttf
