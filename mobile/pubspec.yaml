name: second_bite
description: "Second Bite for customers and sellers, on iOS and Android."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  # The one place the Flutter version is pinned; every workflow reads it (flutter-version-file).
  flutter: 3.47.7

dependencies:
  app_ui:
    path: packages/app_ui
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.0
  intl: ^0.20.3
  riverpod_annotation: ^4.0.7

dev_dependencies:
  build_runner: ^2.16.2
  flutter_test:
    sdk: flutter
  go_router_builder: ^4.5.0
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.9
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
