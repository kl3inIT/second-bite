name: second_bite
description: "Second Bite for customers and sellers, on iOS and Android."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  # The one place the Flutter version is pinned; every workflow reads it (flutter-version-file).
  flutter: 3.47.7

dependencies:
  app_ui:
    path: packages/app_ui
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.1.0
  intl: ^0.20.3
  json_annotation: ^4.12.0
  retrofit: ^4.10.0
  riverpod_annotation: ^4.0.7

dev_dependencies:
  build_runner: ^2.16.2
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  go_router_builder: ^4.5.0
  json_serializable: ^6.14.1
  mocktail: ^1.0.5
  retrofit_generator: ^10.2.12
  riverpod_generator: ^4.0.9
  swagger_parser: ^1.45.0
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true
  # The round pictures of the kinds row, the web's web/src/features/home/kinds.
  assets:
    - assets/kinds/
