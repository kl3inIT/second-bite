# Proposes the newest version of every dependency each week. Updates arrive as
# pull requests that CI checks; none is merged automatically.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /web
    schedule:
      interval: weekly
  - package-ecosystem: pub
    directories:
      - /mobile
      - /mobile/packages/app_ui
      - /mobile/packages/app_ui/widgetbook
    schedule:
      interval: weekly
    groups:
      pub:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
