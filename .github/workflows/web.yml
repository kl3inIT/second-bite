name: Web

on:
  push:
    paths:
      - "web/**"
      - "DESIGN.md"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "DESIGN.md"
      - ".github/workflows/web.yml"

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Tokens, messages, API client, lint, format, types and unit tests
        run: pnpm check
      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Microsoft's image of the Playwright version web/pnpm-lock.yaml locks carries Chromium and its
    # system libraries, as in BeyondPilot's CI. Bump the tag and digest with @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --ipc=host
    env:
      # The job runs as root with HOME on a mount the runner's user also writes, which SWC refuses
      # for its native binding cache; root's own cache directory is not.
      SWC_NATIVE_BINDING_CACHE: /root/.cache/swc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build and test in a phone and a desktop browser
        run: pnpm test:e2e
      - name: Upload the Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
