name: Backend

on:
  push:
    paths:
      - "server/**"
      - "api/**"
      - "ARCHITECTURE.md"
      - "compose.yaml"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "server/**"
      - "api/**"
      - "ARCHITECTURE.md"
      - "compose.yaml"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: server

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # golangci-lint keeps its own cache. The Go cache is Test's alone: jobs sharing one key race to save it, and Lint,
      # finishing first, saved one without the race build or sqlc, which Test then compiled again on every run.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: false
      # make lint locally; the action runs the same command and keeps golangci-lint's cache.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: server

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          # This file is in the key so that a change to what Test builds saves a new cache, as no job can replace one.
          cache-dependency-path: |
            server/go.sum
            .github/workflows/backend.yml
      # Each check is a target of server/Makefile, the commands a developer runs with make verify.
      - name: Check that go.mod and go.sum are tidy
        run: make tidy-check
      - name: Check that the code sqlc generates is current
        run: make sqlc-check
      - name: Test, with the race detector and PostgreSQL in containers
        run: make test-race

  vulnerabilities:
    name: Vulnerabilities
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # govulncheck is a tool in go.mod, so CI runs the version every machine runs; govulncheck-action installs
      # @latest. go.sum alone keys this cache, apart from Test's.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Known vulnerabilities that the code reaches
        run: make vuln

  migrations:
    name: Migrations
    # A migration on main has run in staging and production: a pull request may add one, never change, rename or
    # remove one (docs/guidelines/persistence.md). The merge commit's first parent is the base the pull request targets.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Released migrations are unchanged
        run: make migration-check BASE=HEAD^1

  image:
    name: Image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Layers cached in GitHub's cache, one scope per image, as BeyondPilot's CI does; a miss never fails the build.
      - name: Build the image the server is deployed from
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          load: true
          provenance: false
          tags: second-bite-server
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server,ignore-error=true
      - name: The image carries its revision and refuses to start unconfigured
        run: |
          test "$(docker image inspect second-bite-server --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "${{ github.sha }}"
          ! docker run --rm second-bite-server
