name: Backend

on:
  push:
    paths:
      - "server/**"
      - "api/**"
      - "ARCHITECTURE.md"
      - "compose.yaml"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "server/**"
      - "api/**"
      - "ARCHITECTURE.md"
      - "compose.yaml"
      - ".github/workflows/backend.yml"

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    working-directory: server

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
          working-directory: server

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Check that go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: Check that the code sqlc generates is current
        run: go tool sqlc diff
      - name: Test, with the race detector and PostgreSQL in containers
        run: go test -race -count=1 ./...

  vulnerabilities:
    name: Vulnerabilities
    runs-on: ubuntu-24.04
    steps:
      - uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: server/go.mod
          work-dir: server

  image:
    name: Image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Layers cached in GitHub's cache, one scope per image, as BeyondPilot's CI does; a miss never fails the build.
      - name: Build the image the server is deployed from
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          load: true
          provenance: false
          tags: second-bite-server
          build-args: VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server,ignore-error=true
      - name: The image carries its revision and refuses to start unconfigured
        run: |
          test "$(docker image inspect second-bite-server --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "${{ github.sha }}"
          ! docker run --rm second-bite-server
