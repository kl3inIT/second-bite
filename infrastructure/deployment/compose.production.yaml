# Production on the shared host (docs/runbooks/ci-cd.md), the overlay of compose.base.yaml. It differs from staging's
# in its names, in letting search engines index the site, and in having no preview, which is staging's alone.
# deploy.sh names the images by digest; secrets are files under /apps/secondbite-production/secrets. The host's Nginx
# Proxy Manager, on the external proxy-network, reaches the web and the server by their container names; nothing
# publishes a host port.
services:
  postgres:
    container_name: secondbite-production-postgres
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/database_password
    secrets:
      - database_password

  server:
    container_name: secondbite-production-server
    image: ${SECONDBITE_SERVER_IMAGE:?the server image is named by deploy.sh}
    environment:
      # Google's OAuth client IDs whose tokens are accepted, from .env.production; empty leaves Google off.
      SECONDBITE_GOOGLE_CLIENT_IDS: ${SECONDBITE_GOOGLE_CLIENT_IDS:-}
      # Web Push's public VAPID key and the site's origin, from .env.production; an empty key leaves Web Push off.
      SECONDBITE_PUSH_PUBLIC_KEY: ${SECONDBITE_PUSH_PUBLIC_KEY:-}
      SECONDBITE_SITE_URL: ${SECONDBITE_SITE_URL:-}
    # Each secret is mounted as a file named after the variable it replaces, which the server reads from /run/secrets.
    secrets:
      - source: database_password
        target: SECONDBITE_DATABASE_PASSWORD
      - source: email_settings_key
        target: SECONDBITE_EMAIL_SETTINGS_KEY
      - source: sign_in_code_key
        target: SECONDBITE_SIGN_IN_CODE_KEY
      - source: push_private_key
        target: SECONDBITE_PUSH_PRIVATE_KEY
    networks:
      - internal
      - proxy

  web:
    container_name: secondbite-production-web
    image: ${SECONDBITE_WEB_IMAGE:?the web image is named by deploy.sh}
    environment:
      # The one environment search engines may index (web/src/app/robots.ts).
      SECONDBITE_INDEXABLE: "true"
      # The server by its container name: on the shared proxy-network both environments' servers answer to the
      # service name `server`, so that name would reach either.
      SECONDBITE_API_ORIGIN: http://secondbite-production-server:8080
    networks:
      - internal
      - proxy

  # Filled once, and refreshed, by infrastructure/map/fetch.sh (docs/runbooks/ci-cd.md).
  map:
    container_name: secondbite-production-map
    volumes:
      - /apps/secondbite-production/map:/usr/share/nginx/html/map:ro
    networks:
      - internal
      - proxy

# Each file is owned by uid 65532, the distroless nonroot user of the server, with mode 0400: Compose mounts it as
# it is on the host. PostgreSQL reads its own as root.
secrets:
  database_password:
    file: /apps/secondbite-production/secrets/database-password
  # 32 random bytes in base64 that seal the email provider's key in the database.
  email_settings_key:
    file: /apps/secondbite-production/secrets/email-settings-key
  # 32 random bytes in base64 that key the HMAC of stored sign-in codes.
  sign_in_code_key:
    file: /apps/secondbite-production/secrets/sign-in-code-key
  # The private VAPID key that signs Web Push, written by `secondbite push keys` (SEC-25).
  push_private_key:
    file: /apps/secondbite-production/secrets/push-private-key

networks:
  proxy:
    external: true
    name: proxy-network
