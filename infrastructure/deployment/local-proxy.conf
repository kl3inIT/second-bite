# The routing of the deployed reverse proxy (docs/runbooks/ci-cd.md), for compose.local.yaml.
server {
    listen 80;
    # The server accepts uploads up to 10 MB (file.MaxUploadBytes), plus the multipart framing.
    client_max_body_size 12m;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    # The edge sets the client's address itself and drops Forwarded: a value the client wrote would be read as its
    # address.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";

    # The Go routes have no /api prefix; the trailing slash of proxy_pass drops it.
    location /api/ {
        proxy_pass http://server:8080/;
    }

    location / {
        proxy_pass http://web:3000;
    }
}
