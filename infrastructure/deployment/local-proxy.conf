# The routing of the deployed reverse proxy (docs/runbooks/ci-cd.md), for compose.local.yaml.
# "upgrade" for a WebSocket, "" for any other request, so ordinary requests keep their connections.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    # The server accepts uploads up to 10 MB (file.MaxUploadBytes), plus the multipart framing.
    client_max_body_size 12m;

    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    # The edge sets the client's address itself and drops Forwarded: a value the client wrote would be read as its
    # address.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Forwarded "";

    # The Go routes have no /api prefix; the trailing slash of proxy_pass drops it.
    location /api/ {
        proxy_pass http://server:8080/;
        # GET /live is a WebSocket: the upgrade needs HTTP/1.1 and its two headers, and the server pings every 25
        # seconds, well inside the read timeout.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 75s;
    }

    # The map's archive, glyphs and sprites (SEC-66), read by byte ranges.
    location /map/ {
        proxy_pass http://map:8080;
    }

    location / {
        proxy_pass http://web:3000;
    }
}
