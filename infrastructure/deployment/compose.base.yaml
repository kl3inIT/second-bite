# The services every Second Bite composition runs, adapted from BeyondPilot's (docs/runbooks/ci-cd.md). An overlay
# adds where the images come from, how the secrets arrive and which networks reach the services: compose.local.yaml
# on a workstation, compose.staging.yaml and compose.production.yaml on the shared host. No service publishes a port here.
name: secondbite

# Docker keeps a container's log without bound unless told otherwise, and the host has no daemon-wide limit: each
# service keeps at most 3 files of 20 MB, read with `docker logs`.
x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "3"

services:
  postgres:
    # The image the tests and local development use (compose.yaml), pinned by digest.
    image: postgis/postgis:18-3.6@sha256:ea49d706470cfe1215c4f1e074fcab66d5af52f80adaf90d5a9beace71cd5ce8
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: secondbite
      POSTGRES_USER: secondbite
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Over TCP: during its first start the image initializes PostGIS on a server that listens only on the socket.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "secondbite", "-d", "secondbite"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - internal

  server:
    restart: unless-stopped
    logging: *logging
    environment:
      # The password is a secret file, never part of the URL (server/internal/platform/config.go).
      SECONDBITE_DATABASE_URL: postgres://secondbite@postgres:5432/secondbite?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    # The image's own HEALTHCHECK (`secondbite health`, asking /readyz); the start period covers the migrations
    # the server runs before it serves.
    healthcheck:
      start_period: 120s
    networks:
      - internal

  web:
    restart: unless-stopped
    logging: *logging
    environment:
      # Server rendering calls the Go server directly; the browser reaches it as /api through the reverse proxy.
      SECONDBITE_API_ORIGIN: http://server:8080
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/vi').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - internal

  # The map the web draws a store's pin on (SEC-66): Hanoi's PMTiles archive with its glyphs and sprites, fetched
  # by infrastructure/map/fetch.sh into the folder an overlay mounts at /usr/share/nginx/html/map, served as /map/ on
  # the site's own origin.
  # MapLibre reads the archive by byte ranges, so nothing compresses it and its ETag stays strong.
  map:
    image: nginxinc/nginx-unprivileged:1.31-alpine@sha256:378d0c32f6562f7fd9629170797f57d2b953aa09be983b3daaf4809bb039ca00
    restart: unless-stopped
    logging: *logging
    configs:
      - source: map-nginx
        target: /etc/nginx/conf.d/default.conf
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - internal

configs:
  map-nginx:
    content: |
      server {
          listen 8080;
          root /usr/share/nginx/html;
          # Behind the host's proxy this port is not the browser's, so a redirect names a path only.
          absolute_redirect off;
          # A compressed answer has a weak ETag and no byte ranges, which the PMTiles client refuses.
          gzip off;

          location = /healthz {
              access_log off;
              return 204;
          }

          location /map/ {
              types {
                  application/vnd.pmtiles pmtiles;
                  application/x-protobuf pbf;
                  application/json json;
                  image/png png;
                  text/plain txt;
              }
              default_type application/octet-stream;
              # A day: a refreshed archive has a new ETag, which the client follows on its next range.
              add_header Cache-Control "public, max-age=86400" always;
              add_header X-Content-Type-Options nosniff always;
              try_files $$uri =404;
          }

          location / {
              return 404;
          }
      }

networks:
  internal: {}

volumes:
  postgres-data: {}
