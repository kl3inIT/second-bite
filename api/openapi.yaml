components:
  schemas:
    AccountBody:
      additionalProperties: false
      properties:
        displayName:
          description: Empty until Google gives one or the person sets it
          type: string
        email:
          type: string
        id:
          type: string
        role:
          enum:
            - customer
            - admin
          type: string
      required:
        - id
        - email
        - role
        - displayName
      type: object
    AddSellerStaffRequest:
      additionalProperties: false
      properties:
        email:
          maxLength: 254
          minLength: 3
          type: string
      required:
        - email
      type: object
    CancelOrderRequest:
      additionalProperties: false
      properties:
        reason:
          maxLength: 200
          type: string
      type: object
    CollectionPointBody:
      additionalProperties: false
      properties:
        address:
          type: string
        latitude:
          format: double
          type: number
        longitude:
          format: double
          type: number
      required:
        - latitude
        - longitude
        - address
      type: object
    DeleteAccountInputBody:
      additionalProperties: false
      properties:
        challengeId:
          type: string
        code:
          description: The six digits of the deletion email
          pattern: ^[0-9]{6}$
          type: string
      required:
        - challengeId
        - code
      type: object
    DetailsBody:
      additionalProperties: false
      properties:
        address:
          description: The address as people write it
          maxLength: 300
          minLength: 1
          type: string
        latitude:
          description: Where the seller is, pinned on a map
          format: double
          maximum: 90
          minimum: -90
          type: number
        longitude:
          format: double
          maximum: 180
          minimum: -180
          type: number
        name:
          maxLength: 100
          minLength: 1
          type: string
        phone:
          description: Shown to the seller's members and admins
          maxLength: 30
          type: string
      required:
        - name
        - address
        - latitude
        - longitude
        - phone
      type: object
    DishBody:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        description:
          type: string
        hidden:
          type: boolean
        id:
          type: string
        ingredients:
          type: string
        kind:
          enum:
            - bakery
            - prepared_food
            - ingredients
            - drinks
            - mixed_box
            - other
          type: string
        name:
          type: string
        originalPriceVnd:
          format: int64
          type: integer
        photo:
          $ref: "#/components/schemas/OfferPhotoBody"
        sellerId:
          type: string
        unit:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - sellerId
        - name
        - kind
        - unit
        - description
        - ingredients
        - photo
        - hidden
        - createdAt
        - updatedAt
      type: object
    DishChangeBody:
      additionalProperties: false
      properties:
        description:
          maxLength: 1000
          type: string
        hidden:
          type: boolean
        ingredients:
          maxLength: 500
          type: string
        kind:
          enum:
            - bakery
            - prepared_food
            - ingredients
            - drinks
            - mixed_box
            - other
          type: string
        name:
          maxLength: 80
          minLength: 1
          type: string
        originalPriceVnd:
          format: int64
          minimum: 0
          type: integer
        photoId:
          type: string
        unit:
          maxLength: 20
          type: string
      type: object
    DishDetailsBody:
      additionalProperties: false
      properties:
        description:
          maxLength: 1000
          type: string
        hidden:
          description: Keeps the dish out of the list a post is picked from
          type: boolean
        ingredients:
          description: What the dish is made of and may contain, allergens included
          maxLength: 500
          type: string
        kind:
          enum:
            - bakery
            - prepared_food
            - ingredients
            - drinks
            - mixed_box
            - other
          type: string
        name:
          maxLength: 80
          minLength: 1
          type: string
        originalPriceVnd:
          description: What one unit normally sells for; a post starts from it
          format: int64
          minimum: 1001
          type: integer
        photoId:
          description: From POST /photos, or a photo the seller already shows
          type: string
        unit:
          description: What one unit is called; "suất" when empty
          maxLength: 20
          type: string
      required:
        - name
        - kind
        - photoId
      type: object
    EmailSettingsBody:
      additionalProperties: false
      properties:
        brevoApiKeySet:
          description: Whether a Brevo API key is stored; it is never returned
          type: boolean
        provider:
          enum:
            - smtp
            - brevo
          type: string
        senderAddress:
          format: email
          maxLength: 254
          type: string
        senderName:
          maxLength: 100
          type: string
        smtpHost:
          maxLength: 253
          type: string
        smtpPasswordSet:
          description: Whether an SMTP password is stored; it is never returned
          type: boolean
        smtpPort:
          format: int64
          maximum: 65535
          minimum: 0
          type: integer
        smtpSecurity:
          enum:
            - starttls
            - tls
            - none
          type: string
        smtpUsername:
          maxLength: 254
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - provider
        - senderAddress
        - senderName
        - smtpHost
        - smtpPort
        - smtpSecurity
        - smtpUsername
        - smtpPasswordSet
        - brevoApiKeySet
        - updatedAt
      type: object
    FoundBody:
      additionalProperties: false
      properties:
        collectionPoint:
          $ref: "#/components/schemas/CollectionPointBody"
          description: Where the offer is collected, copied from the seller when it was posted
        createdAt:
          format: date-time
          type: string
        description:
          type: string
        discountPercent:
          format: int64
          type: integer
        distanceMeters:
          description: From the point searched near; absent without one
          format: double
          type: number
        id:
          type: string
        kind:
          enum:
            - bakery
            - prepared_food
            - ingredients
            - drinks
            - mixed_box
            - other
          type: string
        name:
          type: string
        originalPriceVnd:
          format: int64
          type: integer
        photo:
          $ref: "#/components/schemas/OfferPhotoBody"
        priceVnd:
          format: int64
          type: integer
        seller:
          $ref: "#/components/schemas/OfferSellerBody"
        sellerId:
          type: string
        status:
          description: sold_out and closed are read from the units left and the window
          enum:
            - on_sale
            - sold_out
            - closed
            - withdrawn
          type: string
        unit:
          type: string
        units:
          format: int64
          type: integer
        unitsLeft:
          format: int64
          type: integer
        updatedAt:
          format: date-time
          type: string
        weightGrams:
          format: int64
          type: integer
        windowEnd:
          format: date-time
          type: string
        windowStart:
          format: date-time
          type: string
        withdrawnAt:
          format: date-time
          type: string
      required:
        - seller
        - id
        - sellerId
        - status
        - name
        - description
        - kind
        - unit
        - units
        - unitsLeft
        - priceVnd
        - originalPriceVnd
        - discountPercent
        - photo
        - windowStart
        - windowEnd
        - collectionPoint
        - createdAt
        - updatedAt
      type: object
    FoundOutputBody:
      additionalProperties: false
      properties:
        offers:
          items:
            $ref: "#/components/schemas/FoundBody"
          type: array
      required:
        - offers
      type: object
    GoogleMethodBody:
      additionalProperties: false
      properties:
        clientId:
          description: The OAuth client ID the web's Google button uses
          type: string
      required:
        - clientId
      type: object
    GoogleSignInInputBody:
      additionalProperties: false
      properties:
        idToken:
          description: The ID token Google's sign-in handed the page or the application
          maxLength: 8192
          minLength: 1
          type: string
        nonce:
          description: The value whose SHA-256 was given to Google as the nonce; required when the token carries one
          maxLength: 256
          type: string
        session:
          default: token
          description: "token: the token in the body (the mobile application); cookie: the session cookie instead (the web)"
          enum:
            - token
            - cookie
          type: string
      required:
        - idToken
      type: object
    HandOverOrderRequest:
      additionalProperties: false
      properties:
        code:
          pattern: ^[0-9]{4}$
          type: string
      required:
        - code
      type: object
    ListDishesResponse:
      additionalProperties: false
      properties:
        dishes:
          items:
            $ref: "#/components/schemas/DishBody"
          type: array
      required:
        - dishes
      type: object
    MemberBody:
      additionalProperties: false
      properties:
        accountId:
          type: string
        addedAt:
          format: date-time
          type: string
        email:
          type: string
        role:
          enum:
            - owner
            - staff
          type: string
      required:
        - accountId
        - email
        - role
        - addedAt
      type: object
    MembersOutputBody:
      additionalProperties: false
      properties:
        members:
          items:
            $ref: "#/components/schemas/MemberBody"
          type:
            - array
            - "null"
      required:
        - members
      type: object
    MethodsOutputBody:
      additionalProperties: false
      properties:
        google:
          $ref: "#/components/schemas/GoogleMethodBody"
          description: Present when signing in with Google is available
      type: object
    OfferBody:
      additionalProperties: false
      properties:
        collectionPoint:
          $ref: "#/components/schemas/CollectionPointBody"
          description: Where the offer is collected, copied from the seller when it was posted
        createdAt:
          format: date-time
          type: string
        description:
          type: string
        discountPercent:
          format: int64
          type: integer
        id:
          type: string
        kind:
          enum:
            - bakery
            - prepared_food
            - ingredients
            - drinks
            - mixed_box
            - other
          type: string
        name:
          type: string
        originalPriceVnd:
          format: int64
          type: integer
        photo:
          $ref: "#/components/schemas/OfferPhotoBody"
        priceVnd:
          format: int64
          type: integer
        sellerId:
          type: string
        status:
          description: sold_out and closed are read from the units left and the window
          enum:
            - on_sale
            - sold_out
            - closed
            - withdrawn
          type: string
        unit:
          type: string
        units:
          format: int64
          type: integer
        unitsLeft:
          format: int64
          type: integer
        updatedAt:
          format: date-time
          type: string
        weightGrams:
          format: int64
          type: integer
        windowEnd:
          format: date-time
          type: string
        windowStart:
          format: date-time
          type: string
        withdrawnAt:
          format: date-time
          type: string
      required:
        - id
        - sellerId
        - status
        - name
        - description
        - kind
        - unit
        - units
        - unitsLeft
        - priceVnd
        - originalPriceVnd
        - discountPercent
        - photo
        - windowStart
        - windowEnd
        - collectionPoint
        - createdAt
        - updatedAt
      type: object
    OfferChangeBody:
      additionalProperties: false
      properties:
        description:
          maxLength: 1000
          type: string
        kind:
          enum:
            - bakery
            - prepared_food
            - ingredients
            - drinks
            - mixed_box
            - other
          type: string
        name:
          maxLength: 80
          minLength: 1
          type: string
        originalPriceVnd:
          format: int64
          minimum: 1001
          type: integer
        photoId:
          type: string
        priceVnd:
          format: int64
          minimum: 1000
          type: integer
        unit:
          maxLength: 20
          type: string
        units:
          format: int64
          maximum: 999
          minimum: 1
          type: integer
        weightGrams:
          format: int64
          maximum: 100000
          minimum: 1
          type: integer
        windowEnd:
          format: date-time
          type: string
        windowStart:
          format: date-time
          type: string
      type: object
    OfferDetailsBody:
      additionalProperties: false
      properties:
        description:
          description: Required for a mixed_box, which is described by what it may hold; allergens are written here
          maxLength: 1000
          type: string
        kind:
          enum:
            - bakery
            - prepared_food
            - ingredients
            - drinks
            - mixed_box
            - other
          type: string
        name:
          maxLength: 80
          minLength: 1
          type: string
        originalPriceVnd:
          description: What one unit normally sells for; the price must be the minimum discount below it
          format: int64
          minimum: 1001
          type: integer
        photoId:
          description: From POST /photos, or the photo of an earlier offer of the seller
          type: string
        priceVnd:
          description: Price of one unit, in whole đồng
          format: int64
          minimum: 1000
          type: integer
        unit:
          description: What one unit is called; "suất" when empty
          maxLength: 20
          type: string
        units:
          format: int64
          maximum: 999
          minimum: 1
          type: integer
        weightGrams:
          description: Weight of one unit, to measure food saved
          format: int64
          maximum: 100000
          minimum: 1
          type: integer
        windowEnd:
          description: The last handover
          format: date-time
          type: string
        windowStart:
          description: When the offer is ready to collect
          format: date-time
          type: string
      required:
        - name
        - kind
        - units
        - priceVnd
        - originalPriceVnd
        - photoId
        - windowStart
        - windowEnd
      type: object
    OfferPhotoBody:
      additionalProperties: false
      properties:
        id:
          type: string
        largePath:
          type: string
        smallPath:
          type: string
      required:
        - id
        - largePath
        - smallPath
      type: object
    OfferSellerBody:
      additionalProperties: false
      properties:
        address:
          type: string
        id:
          type: string
        name:
          type: string
        photo:
          $ref: "#/components/schemas/OfferPhotoBody"
      required:
        - id
        - name
        - address
      type: object
    OfferSettingsBody:
      additionalProperties: false
      properties:
        defaultRadiusKm:
          description: The search radius when a customer names none
          format: int64
          maximum: 100
          minimum: 1
          type: integer
        maxRadiusKm:
          format: int64
          maximum: 100
          minimum: 1
          type: integer
        minDiscountPercent:
          description: How far below its original price an offer must be priced
          format: int64
          maximum: 90
          minimum: 0
          type: integer
        startsWithinHours:
          description: How far ahead of posting a window may start
          format: int64
          maximum: 72
          minimum: 1
          type: integer
        updatedAt:
          format: date-time
          readOnly: true
          type: string
        updatedBy:
          readOnly: true
          type: string
        windowMaxMinutes:
          description: The longest collection window
          format: int64
          maximum: 1440
          minimum: 15
          type: integer
        windowMinMinutes:
          description: The shortest collection window
          format: int64
          maximum: 1440
          minimum: 15
          type: integer
      required:
        - minDiscountPercent
        - defaultRadiusKm
        - maxRadiusKm
        - windowMinMinutes
        - windowMaxMinutes
        - startsWithinHours
      type: object
    OffersOutputBody:
      additionalProperties: false
      properties:
        offers:
          items:
            $ref: "#/components/schemas/OfferBody"
          type: array
      required:
        - offers
      type: object
    OrderBody:
      additionalProperties: false
      properties:
        access:
          description: "To its customer: proves the order is theirs without signing in, sent back as Order-Access"
          type: string
        cancelReason:
          type: string
        cancelledAt:
          format: date-time
          type: string
        checkoutId:
          description: Shared by the orders placed together from one cart
          type: string
        code:
          description: The collection code, to its customer once the order is ready or its window has opened
          type: string
        codeAttemptsLeft:
          description: How many wrong codes staff may still enter
          format: int64
          type: integer
        collectedAt:
          format: date-time
          type: string
        createdAt:
          format: date-time
          type: string
        customerName:
          description: Who collects, as given with the order
          type: string
        customerPhone:
          description: Their phone number, 0 and nine digits
          type: string
        id:
          type: string
        lines:
          items:
            $ref: "#/components/schemas/OrderLineBody"
          type: array
        number:
          description: What people read aloud, SB- and a number
          type: string
        readyAt:
          format: date-time
          type: string
        refuseNote:
          type: string
        refuseReason:
          enum:
            - not_suitable
            - wrong_items
            - no_answer
            - no_show
            - late
            - sold_out
            - other
          type: string
        refusedAt:
          format: date-time
          type: string
        seller:
          $ref: "#/components/schemas/OrderSellerBody"
          description: Where the order is collected, copied when it was placed
        status:
          description: expired is read from the window's end
          enum:
            - confirmed
            - ready
            - collected
            - cancelled
            - refused
            - expired
          type: string
        totalVnd:
          description: Paid to the seller at the counter
          format: int64
          type: integer
        windowEnd:
          format: date-time
          type: string
        windowStart:
          format: date-time
          type: string
      required:
        - id
        - number
        - status
        - seller
        - lines
        - totalVnd
        - windowStart
        - windowEnd
        - createdAt
        - codeAttemptsLeft
        - checkoutId
        - customerName
        - customerPhone
      type: object
    OrderLineBody:
      additionalProperties: false
      properties:
        name:
          type: string
        offerId:
          type: string
        originalPriceVnd:
          format: int64
          type: integer
        photo:
          $ref: "#/components/schemas/OrderLinePhotoBody"
        priceVnd:
          format: int64
          type: integer
        unit:
          type: string
        units:
          format: int64
          type: integer
      required:
        - offerId
        - name
        - unit
        - priceVnd
        - originalPriceVnd
        - units
        - photo
      type: object
    OrderLinePhotoBody:
      additionalProperties: false
      properties:
        id:
          type: string
        largePath:
          type: string
        smallPath:
          type: string
      required:
        - id
        - largePath
        - smallPath
      type: object
    OrderSellerBody:
      additionalProperties: false
      properties:
        address:
          type: string
        id:
          type: string
        latitude:
          format: double
          type: number
        longitude:
          format: double
          type: number
        name:
          type: string
      required:
        - id
        - name
        - address
        - latitude
        - longitude
      type: object
    OrderWantedBody:
      additionalProperties: false
      properties:
        offerId:
          type: string
        units:
          format: int64
          maximum: 999
          minimum: 1
          type: integer
      required:
        - offerId
        - units
      type: object
    OrdersOutputBody:
      additionalProperties: false
      properties:
        orders:
          items:
            $ref: "#/components/schemas/OrderBody"
          type: array
      required:
        - orders
      type: object
    PhotoBody:
      additionalProperties: false
      properties:
        height:
          format: int64
          type: integer
        id:
          type: string
        largePath:
          description: The photo at most 1600 px on its longer side
          type: string
        smallPath:
          description: The photo at most 400 px on its longer side, for lists
          type: string
        width:
          description: Of the photo as uploaded, turned the way it was taken
          format: int64
          type: integer
      required:
        - id
        - width
        - height
        - largePath
        - smallPath
      type: object
    PlaceOrderBody:
      additionalProperties: false
      properties:
        checkoutId:
          description: Shared by the orders placed together from one cart, one per seller; a new one when omitted
          type: string
        lines:
          description: One to ten different offers of one seller
          items:
            $ref: "#/components/schemas/OrderWantedBody"
          maxItems: 10
          minItems: 1
          type:
            - array
            - "null"
        name:
          description: The name the seller calls at the counter
          maxLength: 50
          minLength: 1
          type: string
        phone:
          description: A Vietnamese phone number, 0 and nine digits; spaces, dots, dashes and +84 are accepted
          maxLength: 20
          minLength: 1
          type: string
      required:
        - lines
        - name
        - phone
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          description: Stable machine-readable reason
          type: string
        detail:
          type: string
        errors:
          description: One entry per invalid member or parameter
          items:
            $ref: "#/components/schemas/Violation"
          type:
            - array
            - "null"
        requestId:
          description: The identifier returned in X-Request-Id
          type: string
        status:
          format: int64
          type: integer
        title:
          type: string
        type:
          description: urn:secondbite:failure:<code in kebab case>
          type: string
      required:
        - type
        - title
        - status
        - code
      type: object
    RefuseOrderRequest:
      additionalProperties: false
      properties:
        note:
          maxLength: 200
          type: string
        reason:
          enum:
            - not_suitable
            - wrong_items
            - no_answer
            - no_show
            - late
            - sold_out
            - other
          type: string
      required:
        - reason
      type: object
    RequestCodeInputBody:
      additionalProperties: false
      properties:
        email:
          description: The address to send the code to
          maxLength: 254
          minLength: 3
          type: string
      required:
        - email
      type: object
    RequestCodeOutputBody:
      additionalProperties: false
      properties:
        challengeId:
          description: Send it back with the code
          type: string
        expiresAt:
          format: date-time
          type: string
      required:
        - challengeId
        - expiresAt
      type: object
    SaveEmailSettingsInputBody:
      additionalProperties: false
      properties:
        brevoApiKey:
          description: Empty keeps the stored key
          maxLength: 1024
          type: string
        provider:
          enum:
            - smtp
            - brevo
          type: string
        senderAddress:
          format: email
          maxLength: 254
          type: string
        senderName:
          maxLength: 100
          minLength: 1
          type: string
        smtpHost:
          maxLength: 253
          type: string
        smtpPassword:
          description: Empty keeps the stored password
          maxLength: 1024
          type: string
        smtpPort:
          format: int64
          maximum: 65535
          minimum: 0
          type: integer
        smtpSecurity:
          enum:
            - starttls
            - tls
            - none
          type: string
        smtpUsername:
          maxLength: 254
          type: string
      required:
        - provider
        - senderAddress
        - senderName
      type: object
    SellerBody:
      additionalProperties: false
      properties:
        address:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        latitude:
          format: double
          type: number
        longitude:
          format: double
          type: number
        myRole:
          description: The caller's role; absent for an admin who is not a member
          enum:
            - owner
            - staff
          type: string
        name:
          type: string
        phone:
          type: string
        photoId:
          description: Served at /photos/{photoId}/1600.jpg and /400.jpg
          type: string
        status:
          enum:
            - pending
            - active
            - blocked
          type: string
        statusChangedAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - address
        - latitude
        - longitude
        - phone
        - status
        - createdAt
        - updatedAt
      type: object
    SellerPhotoBody:
      additionalProperties: false
      properties:
        id:
          type: string
        largePath:
          type: string
        smallPath:
          type: string
      required:
        - id
        - largePath
        - smallPath
      type: object
    SellerProfileBody:
      additionalProperties: false
      properties:
        address:
          type: string
        id:
          type: string
        latitude:
          format: double
          type: number
        longitude:
          format: double
          type: number
        name:
          type: string
        photo:
          $ref: "#/components/schemas/SellerPhotoBody"
      required:
        - id
        - name
        - address
        - latitude
        - longitude
      type: object
    SellersOutputBody:
      additionalProperties: false
      properties:
        sellers:
          items:
            $ref: "#/components/schemas/SellerBody"
          type:
            - array
            - "null"
      required:
        - sellers
      type: object
    SessionOutputBody:
      additionalProperties: false
      properties:
        account:
          $ref: "#/components/schemas/AccountBody"
        expiresAt:
          description: The session ends then unless it is used; each use moves the end 30 days on
          format: date-time
          type: string
        token:
          description: "Send it as Authorization: Bearer <token>; it is shown only now, and not when the cookie was asked for"
          type: string
      required:
        - expiresAt
        - account
      type: object
    SetDisplayNameInputBody:
      additionalProperties: false
      properties:
        displayName:
          description: 1 to 50 characters once trimmed; Google never replaces it
          maxLength: 200
          type: string
      required:
        - displayName
      type: object
    SetSellerPhotoRequest:
      additionalProperties: false
      properties:
        photoId:
          description: From POST /photos
          type: string
      required:
        - photoId
      type: object
    SignInInputBody:
      additionalProperties: false
      properties:
        challengeId:
          type: string
        code:
          description: The six digits of the email
          pattern: ^[0-9]{6}$
          type: string
        session:
          default: token
          description: "token: the token in the body (the mobile application); cookie: the session cookie instead (the web)"
          enum:
            - token
            - cookie
          type: string
      required:
        - challengeId
        - code
      type: object
    Violation:
      additionalProperties: false
      properties:
        code:
          type: string
        detail:
          type: string
        parameter:
          description: The invalid parameter, for example query.limit
          type: string
        pointer:
          description: "JSON Pointer to the body member, for example #/priceVnd"
          type: string
      required:
        - detail
        - code
      type: object
  securitySchemes:
    bearer:
      description: A session token from POST /auth/sessions.
      scheme: bearer
      type: http
    cookie:
      description: "The web's session, set by signing in with \"session\": \"cookie\"."
      in: cookie
      name: secondbite_session
      type: apiKey
info:
  description: The API of Second Bite, a non-profit marketplace for food surplus.
  title: Second Bite API
  version: 0.1.0
openapi: 3.1.0
paths:
  /accounts/me:
    get:
      operationId: getMyAccount
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: The signed-in account
      tags:
        - Accounts
    put:
      description: Trimmed, it holds 1 to 50 characters and no control character. Google's sign-in fills a name only while it is empty, so the chosen one stays.
      operationId: setMyDisplayName
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDisplayNameInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: Set the signed-in account's display name
      tags:
        - Accounts
  /accounts/me/deletion:
    post:
      description: Deletes the account, its sessions, its Google link and the codes and emails sent to its address at once; its memberships of sellers and the photos it uploaded that nothing uses follow within minutes. A seller the account owned is blocked. The session cookie is cleared.
      operationId: deleteMyAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountInputBody"
        required: true
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                description: Clears the session cookie
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: Delete the signed-in account with the emailed code
      tags:
        - Accounts
  /accounts/me/deletion-codes:
    post:
      description: The code confirms the deletion only; it cannot sign in. It shares the address's limits with the sign-in codes.
      operationId: requestAccountDeletionCode
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestCodeOutputBody"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: Email the signed-in account's address a code that confirms its deletion
      tags:
        - Accounts
  /admin/email-settings:
    get:
      operationId: getEmailSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSettingsBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: Read who delivers email
      tags:
        - Admins
    put:
      operationId: saveEmailSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveEmailSettingsInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: Choose who delivers email; the next email uses it
      tags:
        - Admins
  /admin/offer-settings:
    get:
      operationId: getOfferSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferSettingsBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: The rules every offer follows
      tags:
        - Admin
    put:
      description: New rules apply to offers posted, and to the prices and windows changed, after they are saved.
      operationId: saveOfferSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferSettingsBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferSettingsBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: Change the rules every offer follows
      tags:
        - Admin
  /admin/sellers:
    get:
      operationId: listSellersForAdmins
      parameters:
        - explode: false
          in: query
          name: status
          schema:
            default: pending
            enum:
              - pending
              - active
              - blocked
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            default: 0
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellersOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: Sellers in a status, oldest first
      tags:
        - Admin
  /admin/sellers/{sellerId}/activate:
    post:
      operationId: activateSeller
      parameters:
        - in: path
          name: sellerId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: Let a seller publish; also lifts a block
      tags:
        - Admin
  /admin/sellers/{sellerId}/block:
    post:
      operationId: blockSeller
      parameters:
        - in: path
          name: sellerId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: Stop a seller from publishing
      tags:
        - Admin
  /auth/google:
    post:
      description: Creates the account on a first sign-in with a verified address, or links an account with the address when Google speaks for it (gmail.com or a Google Workspace account); otherwise the person signs in with an emailed code.
      operationId: signInWithGoogle
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleSignInInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionOutputBody"
          description: Created
          headers:
            Set-Cookie:
              schema:
                description: The session cookie, when it was asked for
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Sign in with Google's ID token
      tags:
        - Sign-in
  /auth/methods:
    get:
      operationId: getSignInMethods
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MethodsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: The ways to sign in besides the emailed code
      tags:
        - Sign-in
  /auth/sessions:
    post:
      description: Creates the account on its first sign-in. The web asks for the session in a cookie.
      operationId: signIn
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionOutputBody"
          description: Created
          headers:
            Set-Cookie:
              schema:
                description: The session cookie, when it was asked for
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Sign in with the emailed code
      tags:
        - Sign-in
  /auth/sessions/current:
    delete:
      operationId: signOut
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                description: Clears the session cookie
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: "Sign out: end this session and clear its cookie"
      tags:
        - Sign-in
  /auth/sign-in-codes:
    post:
      description: The answer is the same whether or not the address has an account.
      operationId: requestSignInCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestCodeInputBody"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestCodeOutputBody"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Email a six-digit sign-in code
      tags:
        - Sign-in
  /dishes/{dishId}:
    delete:
      description: The offers posted from it are not affected.
      operationId: removeDish
      parameters:
        - in: path
          name: dishId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: Delete a dish from the catalog
      tags:
        - Catalog
    patch:
      operationId: changeDish
      parameters:
        - in: path
          name: dishId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DishChangeBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DishBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: Change a dish, or show or hide it
      tags:
        - Catalog
  /offers:
    get:
      description: Anyone may search. Offers sold out are included unless available is set; those withdrawn, over or of a blocked seller never are.
      operationId: searchOffers
      parameters:
        - description: latitude,longitude, such as 21.0565,105.8964
          explode: false
          in: query
          name: near
          schema:
            description: latitude,longitude, such as 21.0565,105.8964
            pattern: ^-?[0-9]+(\.[0-9]+)?,-?[0-9]+(\.[0-9]+)?$
            type: string
        - description: Around near; the settings' default when absent, never more than their maximum
          explode: false
          in: query
          name: radiusKm
          schema:
            description: Around near; the settings' default when absent, never more than their maximum
            format: int64
            maximum: 100
            minimum: 0
            type: integer
        - description: Words; typed without marks they match any marks ("ca" finds cá and cà), with marks only those
          explode: false
          in: query
          name: q
          schema:
            description: Words; typed without marks they match any marks ("ca" finds cá and cà), with marks only those
            maxLength: 200
            type: string
        - description: One or more kinds, comma-separated
          explode: false
          in: query
          name: kind
          schema:
            description: One or more kinds, comma-separated
            items:
              enum:
                - bakery
                - prepared_food
                - ingredients
                - drinks
                - mixed_box
                - other
              type: string
            type:
              - array
              - "null"
        - description: The lowest price of one unit, in đồng
          explode: false
          in: query
          name: minPrice
          schema:
            description: The lowest price of one unit, in đồng
            format: int64
            minimum: 0
            type: integer
        - description: The highest price of one unit, in đồng
          explode: false
          in: query
          name: maxPrice
          schema:
            description: The highest price of one unit, in đồng
            format: int64
            minimum: 0
            type: integer
        - description: Keep offers whose window overlaps collectFrom to collectTo; both at one moment keep what can be collected then
          explode: false
          in: query
          name: collectFrom
          schema:
            description: Keep offers whose window overlaps collectFrom to collectTo; both at one moment keep what can be collected then
            format: date-time
            type: string
        - explode: false
          in: query
          name: collectTo
          schema:
            format: date-time
            type: string
        - description: One seller's offers
          explode: false
          in: query
          name: sellerId
          schema:
            description: One seller's offers
            type: string
        - description: Leave out what has sold out
          explode: false
          in: query
          name: available
          schema:
            description: Leave out what has sold out
            type: boolean
        - description: relevance with q, distance with near, ending_soon otherwise, when absent
          explode: false
          in: query
          name: sort
          schema:
            description: relevance with q, distance with near, ending_soon otherwise, when absent
            enum:
              - relevance
              - distance
              - ending_soon
              - price
              - discount
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 20
            format: int64
            maximum: 50
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            default: 0
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - {}
        - bearer: []
        - cookie: []
      summary: Find offers on sale or sold out, near a point, by words and filters
      tags:
        - Offers
  /offers/{offerId}:
    get:
      description: Anyone reads an offer while its window is open and it is not withdrawn; its seller's people read it always.
      operationId: getOffer
      parameters:
        - in: path
          name: offerId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - {}
        - bearer: []
        - cookie: []
      summary: An offer
      tags:
        - Offers
    patch:
      description: Once units are ordered, only the description, the photo and the units (never below those ordered) change.
      operationId: changeOffer
      parameters:
        - in: path
          name: offerId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferChangeBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: Change an offer
      tags:
        - Offers
  /offers/{offerId}/withdraw:
    post:
      operationId: withdrawOffer
      parameters:
        - in: path
          name: offerId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: Take an offer off sale for good
      tags:
        - Offers
  /orders:
    get:
      operationId: listMyOrders
      parameters:
        - description: "open: still to collect; ended: every other"
          explode: false
          in: query
          name: state
          schema:
            description: "open: still to collect; ended: every other"
            enum:
              - open
              - ended
            type: string
        - description: Only the orders placed together from this cart
          explode: false
          in: query
          name: checkout
          schema:
            description: Only the orders placed together from this cart
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 20
            format: int64
            maximum: 50
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            default: 0
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrdersOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: Your orders, newest first
      tags:
        - Orders
    post:
      description: Confirmed at once, signed in or not; for the account when someone is signed in. Sending the same Idempotency-Key again, without an account with the same phone number, returns the order placed first.
      operationId: placeOrder
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            maxLength: 255
            minLength: 1
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaceOrderBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - {}
        - bearer: []
        - cookie: []
      summary: Order units of one seller's offers, collected at the counter
      tags:
        - Orders
  /orders/{orderId}:
    get:
      description: To its customer, signed in or sending its access, with the code once it may be shown; to the seller's people and to admins.
      operationId: getOrder
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
        - description: The order's access, for its customer who did not sign in
          in: header
          name: Order-Access
          schema:
            description: The order's access, for its customer who did not sign in
            maxLength: 64
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - {}
        - bearer: []
        - cookie: []
      summary: An order
      tags:
        - Orders
  /orders/{orderId}/cancel:
    post:
      description: By its customer, signed in or sending its access. Its units go back on sale.
      operationId: cancelOrder
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
        - description: The order's access, for its customer who did not sign in
          in: header
          name: Order-Access
          schema:
            description: The order's access, for its customer who did not sign in
            maxLength: 64
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelOrderRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - {}
        - bearer: []
        - cookie: []
      summary: Cancel your order, free of charge until its window opens
      tags:
        - Orders
  /orders/{orderId}/deliver:
    post:
      description: No code is asked, and a customer may come before the window opens.
      operationId: deliverOrder
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: Hand an order over at the counter, where its customer pays in cash
      tags:
        - Orders
  /orders/{orderId}/hand-over:
    post:
      description: Within the window. A wrong code is counted; the third locks the code.
      operationId: handOverOrder
      parameters:
        - in: path
