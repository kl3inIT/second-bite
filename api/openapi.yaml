components:
  schemas:
    AccountBody:
      additionalProperties: false
      properties:
        email:
          type: string
        id:
          type: string
        role:
          enum:
            - customer
            - admin
          type: string
      required:
        - id
        - email
        - role
      type: object
    AddSellerStaffRequest:
      additionalProperties: false
      properties:
        email:
          maxLength: 254
          minLength: 3
          type: string
      required:
        - email
      type: object
    DetailsBody:
      additionalProperties: false
      properties:
        address:
          description: The address as people write it
          maxLength: 300
          minLength: 1
          type: string
        latitude:
          description: Where the seller is, pinned on a map
          format: double
          maximum: 90
          minimum: -90
          type: number
        longitude:
          format: double
          maximum: 180
          minimum: -180
          type: number
        name:
          maxLength: 100
          minLength: 1
          type: string
        phone:
          description: Shown to the seller's members and admins
          maxLength: 30
          minLength: 9
          type: string
      required:
        - name
        - address
        - latitude
        - longitude
        - phone
      type: object
    EmailSettingsBody:
      additionalProperties: false
      properties:
        brevoApiKeySet:
          description: Whether a Brevo API key is stored; it is never returned
          type: boolean
        provider:
          enum:
            - smtp
            - brevo
          type: string
        senderAddress:
          format: email
          maxLength: 254
          type: string
        senderName:
          maxLength: 100
          type: string
        smtpHost:
          maxLength: 253
          type: string
        smtpPasswordSet:
          description: Whether an SMTP password is stored; it is never returned
          type: boolean
        smtpPort:
          format: int64
          maximum: 65535
          minimum: 0
          type: integer
        smtpSecurity:
          enum:
            - starttls
            - tls
            - none
          type: string
        smtpUsername:
          maxLength: 254
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - provider
        - senderAddress
        - senderName
        - smtpHost
        - smtpPort
        - smtpSecurity
        - smtpUsername
        - smtpPasswordSet
        - brevoApiKeySet
        - updatedAt
      type: object
    MemberBody:
      additionalProperties: false
      properties:
        accountId:
          type: string
        addedAt:
          format: date-time
          type: string
        email:
          type: string
        role:
          enum:
            - owner
            - staff
          type: string
      required:
        - accountId
        - email
        - role
        - addedAt
      type: object
    MembersOutputBody:
      additionalProperties: false
      properties:
        members:
          items:
            $ref: "#/components/schemas/MemberBody"
          type:
            - array
            - "null"
      required:
        - members
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          description: Stable machine-readable reason
          type: string
        detail:
          type: string
        errors:
          description: One entry per invalid member or parameter
          items:
            $ref: "#/components/schemas/Violation"
          type:
            - array
            - "null"
        requestId:
          description: The identifier returned in X-Request-Id
          type: string
        status:
          format: int64
          type: integer
        title:
          type: string
        type:
          description: urn:secondbite:failure:<code in kebab case>
          type: string
      required:
        - type
        - title
        - status
        - code
      type: object
    RequestCodeInputBody:
      additionalProperties: false
      properties:
        email:
          description: The address to send the code to
          maxLength: 254
          minLength: 3
          type: string
      required:
        - email
      type: object
    RequestCodeOutputBody:
      additionalProperties: false
      properties:
        challengeId:
          description: Send it back with the code
          type: string
        expiresAt:
          format: date-time
          type: string
      required:
        - challengeId
        - expiresAt
      type: object
    SaveEmailSettingsInputBody:
      additionalProperties: false
      properties:
        brevoApiKey:
          description: Empty keeps the stored key
          maxLength: 1024
          type: string
        provider:
          enum:
            - smtp
            - brevo
          type: string
        senderAddress:
          format: email
          maxLength: 254
          type: string
        senderName:
          maxLength: 100
          minLength: 1
          type: string
        smtpHost:
          maxLength: 253
          type: string
        smtpPassword:
          description: Empty keeps the stored password
          maxLength: 1024
          type: string
        smtpPort:
          format: int64
          maximum: 65535
          minimum: 0
          type: integer
        smtpSecurity:
          enum:
            - starttls
            - tls
            - none
          type: string
        smtpUsername:
          maxLength: 254
          type: string
      required:
        - provider
        - senderAddress
        - senderName
      type: object
    SellerBody:
      additionalProperties: false
      properties:
        address:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        latitude:
          format: double
          type: number
        longitude:
          format: double
          type: number
        myRole:
          description: The caller's role; absent for an admin who is not a member
          enum:
            - owner
            - staff
          type: string
        name:
          type: string
        phone:
          type: string
        status:
          enum:
            - pending
            - active
            - blocked
          type: string
        statusChangedAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - address
        - latitude
        - longitude
        - phone
        - status
        - createdAt
        - updatedAt
      type: object
    SellersOutputBody:
      additionalProperties: false
      properties:
        sellers:
          items:
            $ref: "#/components/schemas/SellerBody"
          type:
            - array
            - "null"
      required:
        - sellers
      type: object
    SessionOutputBody:
      additionalProperties: false
      properties:
        account:
          $ref: "#/components/schemas/AccountBody"
        expiresAt:
          description: The session ends then unless it is used; each use moves the end 30 days on
          format: date-time
          type: string
        token:
          description: "Send it as Authorization: Bearer <token>; it is shown only now"
          type: string
      required:
        - token
        - expiresAt
        - account
      type: object
    SignInInputBody:
      additionalProperties: false
      properties:
        challengeId:
          type: string
        code:
          description: The six digits of the email
          pattern: ^[0-9]{6}$
          type: string
      required:
        - challengeId
        - code
      type: object
    Violation:
      additionalProperties: false
      properties:
        code:
          type: string
        detail:
          type: string
        parameter:
          description: The invalid parameter, for example query.limit
          type: string
        pointer:
          description: "JSON Pointer to the body member, for example #/priceVnd"
          type: string
      required:
        - detail
        - code
      type: object
  securitySchemes:
    bearer:
      description: A session token from POST /auth/sessions.
      scheme: bearer
      type: http
info:
  description: The API of Second Bite, a non-profit marketplace for food surplus.
  title: Second Bite API
  version: 0.1.0
openapi: 3.1.0
paths:
  /accounts/me:
    get:
      operationId: getMyAccount
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
      summary: The signed-in account
      tags:
        - Accounts
  /admin/email-settings:
    get:
      operationId: getEmailSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSettingsBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
      summary: Read who delivers email
      tags:
        - Admins
    put:
      operationId: saveEmailSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveEmailSettingsInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
      summary: Choose who delivers email; the next email uses it
      tags:
        - Admins
  /admin/sellers:
    get:
      operationId: listSellersForAdmins
      parameters:
        - explode: false
          in: query
          name: status
          schema:
            default: pending
            enum:
              - pending
              - active
              - blocked
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            default: 0
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellersOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
      summary: Sellers in a status, oldest first
      tags:
        - Admin
  /admin/sellers/{sellerId}/activate:
    post:
      operationId: activateSeller
      parameters:
        - in: path
          name: sellerId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
      summary: Let a seller publish; also lifts a block
      tags:
        - Admin
  /admin/sellers/{sellerId}/block:
    post:
      operationId: blockSeller
      parameters:
        - in: path
          name: sellerId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
      summary: Stop a seller from publishing
      tags:
        - Admin
  /auth/sessions:
    post:
      description: Creates the account on its first sign-in.
      operationId: signIn
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionOutputBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Sign in with the emailed code
      tags:
        - Sign-in
  /auth/sessions/current:
    delete:
      operationId: signOut
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
      summary: "Sign out: end the session of this token"
      tags:
        - Sign-in
  /auth/sign-in-codes:
    post:
      description: The answer is the same whether or not the address has an account.
      operationId: requestSignInCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestCodeInputBody"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestCodeOutputBody"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Email a six-digit sign-in code
      tags:
        - Sign-in
  /sellers:
    post:
      operationId: openSeller
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetailsBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
      summary: Open a seller; it waits for an admin to activate it
      tags:
        - Sellers
  /sellers/mine:
    get:
      operationId: listMySellers
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellersOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
      summary: The sellers I own or work for
      tags:
        - Sellers
  /sellers/{sellerId}:
    get:
      operationId: getSeller
      parameters:
        - in: path
          name: sellerId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
      summary: A seller, to its members and admins
      tags:
        - Sellers
    put:
      operationId: updateSeller
      parameters:
        - in: path
          name: sellerId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetailsBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
      summary: Change a seller's details; only its owner may
      tags:
        - Sellers
  /sellers/{sellerId}/members:
    get:
      operationId: listSellerMembers
      parameters:
        - in: path
          name: sellerId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembersOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
      summary: The owner and staff of a seller
      tags:
        - Sellers
    post:
      description: The person is staff at once and signs in with an emailed code to that address.
      operationId: addSellerStaff
      parameters:
        - in: path
          name: sellerId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddSellerStaffRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
      summary: Add a staff member by email; only the owner may
      tags:
        - Sellers
  /sellers/{sellerId}/members/{accountId}:
    delete:
      operationId: removeSellerMember
      parameters:
        - in: path
          name: sellerId
          required: true
          schema:
            type: string
        - in: path
          name: accountId
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
      summary: Remove a staff member, or leave the seller
      tags:
        - Sellers
