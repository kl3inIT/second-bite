  /admin/sellers:
    get:
      description: Pending sellers come first, the oldest first; then the latest change first. q matches the name, address or phone, Vietnamese marks ignored. A page past the end is empty.
      operationId: listSellersForAdmins
      parameters:
        - description: Keep these statuses; every status when absent
          explode: false
          in: query
          name: status
          schema:
            description: Keep these statuses; every status when absent
            items:
              enum:
                - pending
                - active
                - rejected
                - blocked
              type: string
            type:
              - array
              - "null"
        - description: Words of the name, address or phone
          explode: false
          in: query
          name: q
          schema:
            description: Words of the name, address or phone
            maxLength: 100
            type: string
        - description: name, address or changed; a leading - is descending; the queue order when absent
          explode: false
          in: query
          name: sort
          schema:
            description: name, address or changed; a leading - is descending; the queue order when absent
            enum:
              - name
              - -name
              - address
              - -address
              - changed
              - -changed
            type: string
        - explode: false
          in: query
          name: page
          schema:
            default: 1
            format: int64
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: size
          schema:
            default: 25
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - description: Keep the sellers last changed at or after this time
          explode: false
          in: query
          name: changedSince
          schema:
            description: Keep the sellers last changed at or after this time
            format: date-time
            type: string
        - description: Keep the sellers last changed before this time
          explode: false
          in: query
          name: changedUntil
          schema:
            description: Keep the sellers last changed before this time
            format: date-time
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSellersOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: Sellers by status and words, pending ones first
      tags:
        - Admin
