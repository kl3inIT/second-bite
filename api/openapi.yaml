components:
  schemas:
    AccountBody:
      additionalProperties: false
      properties:
        displayName:
          description: Empty until Google gives one or the person sets it
          type: string
        email:
          type: string
        id:
          type: string
        role:
          enum:
            - customer
            - admin
          type: string
      required:
        - id
        - email
        - role
        - displayName
      type: object
    AddSellerStaffRequest:
      additionalProperties: false
      properties:
        email:
          maxLength: 254
          minLength: 3
          type: string
      required:
        - email
      type: object
    AdminAccountsOutputBody:
      additionalProperties: false
      properties:
        counts:
          $ref: "#/components/schemas/RoleCountsBody"
          description: How many accounts of each role match the words, whatever the role asked
        items:
          items:
            $ref: "#/components/schemas/RecordBody"
          type:
            - array
            - "null"
        page:
          format: int64
          type: integer
        pageSize:
          format: int64
          type: integer
        total:
          description: How many accounts match the role and the words
          format: int64
          type: integer
      required:
        - items
        - page
        - pageSize
        - total
        - counts
      type: object
    AdminSellerBody:
      additionalProperties: false
      properties:
        address:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        latitude:
          format: double
          type: number
        longitude:
          format: double
          type: number
        name:
          type: string
        ownerEmail:
          description: Absent when the owner deleted their account
          type: string
        phone:
          type: string
        photoId:
          description: Served at /photos/{photoId}/1600.jpg and /400.jpg
          type: string
        status:
          enum:
            - pending
            - active
            - rejected
            - blocked
          type: string
        statusChangedAt:
          format: date-time
          type: string
        statusReason:
          description: Why an admin rejected or blocked the seller, as the owner is told
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - address
        - latitude
        - longitude
        - phone
        - status
        - createdAt
        - updatedAt
      type: object
    AdminSellersOutputBody:
      additionalProperties: false
      properties:
        counts:
          $ref: "#/components/schemas/StatusCountsBody"
          description: Sellers of each status matching q, whatever status asks
        days:
          description: Sellers of each status on each of the last 14 days in Vietnam, the oldest first, whatever the filters; a day before counting started is absent
          items:
            $ref: "#/components/schemas/StatusDayBody"
          type:
            - array
            - "null"
        items:
          items:
            $ref: "#/components/schemas/AdminSellerBody"
          type:
            - array
            - "null"
        page:
          format: int64
          type: integer
        pageSize:
          format: int64
          type: integer
        total:
          format: int64
          type: integer
      required:
        - items
        - page
        - pageSize
        - total
        - counts
        - days
      type: object
    AdminsOutputBody:
      additionalProperties: false
      properties:
        admins:
          description: Every admin, by address
          items:
            $ref: "#/components/schemas/RecordBody"
          type:
            - array
            - "null"
      required:
        - admins
      type: object
    AuditChangeBody:
      additionalProperties: false
      properties:
        field:
          type: string
        from:
          description: The value before; absent for a secret or the SMTP user
          type: string
        to:
          description: The value after; absent likewise
          type: string
      required:
        - field
      type: object
    AuditDetailsBody:
      additionalProperties: false
      properties:
        changes:
          description: The settings changed
          items:
            $ref: "#/components/schemas/AuditChangeBody"
          type:
            - array
            - "null"
        provider:
          description: Who delivers email after the change
          enum:
            - smtp
            - brevo
          type: string
        reason:
          description: What the owner was told, for a rejection or a block
          type: string
        source:
          description: Where a change of admins came from
          enum:
            - admin
            - command_line
          type: string
      type: object
    AuditEventBody:
      additionalProperties: false
      properties:
        action:
          enum:
            - offer_settings.change
            - email_settings.change
            - admin.grant
            - admin.revoke
            - seller.approve
            - seller.reject
            - seller.block
            - seller.unblock
          type: string
        actorId:
          type: string
        actorLabel:
          type: string
        details:
          $ref: "#/components/schemas/AuditDetailsBody"
        id:
          type: string
        occurredAt:
          format: date-time
          type: string
        resourceId:
          type: string
        resourceLabel:
          description: The store's name or the account's address at the time; absent once that account is deleted
          type: string
        resourceType:
          enum:
            - account
            - seller
            - offer_settings
            - email_settings
          type: string
      required:
        - id
        - occurredAt
        - action
        - resourceType
        - resourceId
        - details
      type: object
    AuditEventsOutputBody:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: "#/components/schemas/AuditEventBody"
          type:
            - array
            - "null"
        page:
          format: int64
          type: integer
        pageSize:
          format: int64
          type: integer
        total:
          format: int64
          type: integer
      required:
        - items
        - page
        - pageSize
        - total
      type: object
    BlockSellerRequest:
      additionalProperties: false
      properties:
        reason:
          description: What the owner is told, 10 to 500 characters
          maxLength: 500
          minLength: 10
          type: string
      required:
        - reason
      type: object
    CancelOrderRequest:
      additionalProperties: false
      properties:
        reason:
          maxLength: 200
          type: string
      type: object
    CollectionPointBody:
      additionalProperties: false
      properties:
        address:
          type: string
        latitude:
          format: double
          type: number
        longitude:
          format: double
          type: number
      required:
        - latitude
        - longitude
        - address
      type: object
    DeleteAccountInputBody:
      additionalProperties: false
      properties:
        challengeId:
          type: string
        code:
          description: The six digits of the deletion email
          pattern: ^[0-9]{6}$
          type: string
      required:
        - challengeId
        - code
      type: object
    DetailsBody:
      additionalProperties: false
      properties:
        address:
          description: The address as people write it
          maxLength: 300
          minLength: 1
          type: string
        latitude:
          description: Where the seller is, pinned on a map
          format: double
          maximum: 90
          minimum: -90
          type: number
        longitude:
          format: double
          maximum: 180
          minimum: -180
          type: number
        name:
          maxLength: 100
          minLength: 1
          type: string
        phone:
          description: Shown to the seller's members and admins
          maxLength: 30
          type: string
      required:
        - name
        - address
        - latitude
        - longitude
        - phone
      type: object
    DishBody:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        description:
          type: string
        hidden:
          type: boolean
        id:
          type: string
        ingredients:
          type: string
        kind:
          enum:
            - bakery
            - prepared_food
            - ingredients
            - drinks
            - mixed_box
            - other
          type: string
        name:
          type: string
        originalPriceVnd:
          format: int64
          type: integer
        photo:
          $ref: "#/components/schemas/OfferPhotoBody"
        sellerId:
          type: string
        unit:
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - sellerId
        - name
        - kind
        - unit
        - description
        - ingredients
        - photo
        - hidden
        - createdAt
        - updatedAt
      type: object
    DishChangeBody:
      additionalProperties: false
      properties:
        description:
          maxLength: 1000
          type: string
        hidden:
          type: boolean
        ingredients:
          maxLength: 500
          type: string
        kind:
          enum:
            - bakery
            - prepared_food
            - ingredients
            - drinks
            - mixed_box
            - other
          type: string
        name:
          maxLength: 80
          minLength: 1
          type: string
        originalPriceVnd:
          format: int64
          minimum: 0
          type: integer
        photoId:
          type: string
        unit:
          maxLength: 20
          type: string
      type: object
    DishDetailsBody:
      additionalProperties: false
      properties:
        description:
          maxLength: 1000
          type: string
        hidden:
          description: Keeps the dish out of the list a post is picked from
          type: boolean
        ingredients:
          description: What the dish is made of and may contain, allergens included
          maxLength: 500
          type: string
        kind:
          enum:
            - bakery
            - prepared_food
            - ingredients
            - drinks
            - mixed_box
            - other
          type: string
        name:
          maxLength: 80
          minLength: 1
          type: string
        originalPriceVnd:
          description: What one unit normally sells for; a post starts from it
          format: int64
          minimum: 1001
          type: integer
        photoId:
          description: From POST /photos, or a photo the seller already shows
          type: string
        unit:
          description: What one unit is called; "suất" when empty
          maxLength: 20
          type: string
      required:
        - name
        - kind
        - photoId
      type: object
    EmailSettingsBody:
      additionalProperties: false
      properties:
        brevoApiKeySet:
          description: Whether a Brevo API key is stored; it is never returned
          type: boolean
        provider:
          enum:
            - smtp
            - brevo
          type: string
        senderAddress:
          format: email
          maxLength: 254
          type: string
        senderName:
          maxLength: 100
          type: string
        smtpHost:
          maxLength: 253
          type: string
        smtpPasswordSet:
          description: Whether an SMTP password is stored; it is never returned
          type: boolean
        smtpPort:
          format: int64
          maximum: 65535
          minimum: 0
          type: integer
        smtpSecurity:
          enum:
            - starttls
            - tls
            - none
          type: string
        smtpUsername:
          maxLength: 254
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - provider
        - senderAddress
        - senderName
        - smtpHost
        - smtpPort
        - smtpSecurity
        - smtpUsername
        - smtpPasswordSet
        - brevoApiKeySet
        - updatedAt
      type: object
    FoundBody:
      additionalProperties: false
      properties:
        collectionPoint:
          $ref: "#/components/schemas/CollectionPointBody"
          description: Where the offer is collected, copied from the seller when it was posted
        createdAt:
          format: date-time
          type: string
        description:
          type: string
        discountPercent:
          format: int64
          type: integer
        distanceMeters:
          description: From the point searched near; absent without one
          format: double
          type: number
        id:
          type: string
        kind:
          enum:
            - bakery
            - prepared_food
            - ingredients
            - drinks
            - mixed_box
            - other
          type: string
        name:
          type: string
        originalPriceVnd:
          format: int64
          type: integer
        photo:
          $ref: "#/components/schemas/OfferPhotoBody"
        priceVnd:
          format: int64
          type: integer
        seller:
          $ref: "#/components/schemas/OfferSellerBody"
        sellerId:
          type: string
        status:
          description: sold_out and closed are read from the units left and the window
          enum:
            - on_sale
            - sold_out
            - closed
            - withdrawn
          type: string
        unit:
          type: string
        units:
          format: int64
          type: integer
        unitsLeft:
          format: int64
          type: integer
        updatedAt:
          format: date-time
          type: string
        weightGrams:
          format: int64
          type: integer
        windowEnd:
          format: date-time
          type: string
        windowStart:
          format: date-time
          type: string
        withdrawnAt:
          format: date-time
          type: string
      required:
        - seller
        - id
        - sellerId
        - status
        - name
        - description
        - kind
        - unit
        - units
        - unitsLeft
        - priceVnd
        - originalPriceVnd
        - discountPercent
        - photo
        - windowStart
        - windowEnd
        - collectionPoint
        - createdAt
        - updatedAt
      type: object
    FoundOutputBody:
      additionalProperties: false
      properties:
        offers:
          items:
            $ref: "#/components/schemas/FoundBody"
          type: array
      required:
        - offers
      type: object
    GoogleMethodBody:
      additionalProperties: false
      properties:
        clientId:
          description: The OAuth client ID the web's Google button uses
          type: string
      required:
        - clientId
      type: object
    GoogleSignInInputBody:
      additionalProperties: false
      properties:
        idToken:
          description: The ID token Google's sign-in handed the page or the application
          maxLength: 8192
          minLength: 1
          type: string
        nonce:
          description: The value whose SHA-256 was given to Google as the nonce; required when the token carries one
          maxLength: 256
          type: string
        session:
          default: token
          description: "token: the token in the body (the mobile application); cookie: the session cookie instead (the web)"
          enum:
            - token
            - cookie
          type: string
      required:
        - idToken
      type: object
    GrantAdminRequest:
      additionalProperties: false
      properties:
        email:
          description: The address of the account
          maxLength: 254
          minLength: 3
          type: string
      required:
        - email
      type: object
    HistoryOutputBody:
      additionalProperties: false
      properties:
        collected:
          description: Orders handed over
          format: int64
          type: integer
        missed:
          description: "Orders the customer did not come for: the window ended, or staff ended them as no answer, no show or late"
          format: int64
          type: integer
        placed:
          format: int64
          type: integer
        recent:
          description: The latest five, newest first
          items:
            $ref: "#/components/schemas/OrderBody"
          type: array
      required:
        - placed
        - collected
        - missed
        - recent
      type: object
    ListDishesResponse:
      additionalProperties: false
      properties:
        dishes:
          items:
            $ref: "#/components/schemas/DishBody"
          type: array
      required:
        - dishes
      type: object
    MemberBody:
      additionalProperties: false
      properties:
        accountId:
          type: string
        addedAt:
          format: date-time
          type: string
        email:
          type: string
        role:
          enum:
            - owner
            - staff
          type: string
      required:
        - accountId
        - email
        - role
        - addedAt
      type: object
    MembersOutputBody:
      additionalProperties: false
      properties:
        members:
          items:
            $ref: "#/components/schemas/MemberBody"
          type:
            - array
            - "null"
      required:
        - members
      type: object
    MembershipBody:
      additionalProperties: false
      properties:
        accountId:
          type: string
        role:
          enum:
            - owner
            - staff
          type: string
        sellerId:
          type: string
        sellerName:
          type: string
        sellerStatus:
          enum:
            - pending
            - active
            - rejected
            - blocked
          type: string
      required:
        - accountId
        - role
        - sellerId
        - sellerName
        - sellerStatus
      type: object
    MembershipsOutputBody:
      additionalProperties: false
      properties:
        memberships:
          items:
            $ref: "#/components/schemas/MembershipBody"
          type:
            - array
            - "null"
      required:
        - memberships
      type: object
    MethodsOutputBody:
      additionalProperties: false
      properties:
        google:
          $ref: "#/components/schemas/GoogleMethodBody"
          description: Present when signing in with Google is available
      type: object
    OfferBody:
      additionalProperties: false
      properties:
        collectionPoint:
          $ref: "#/components/schemas/CollectionPointBody"
          description: Where the offer is collected, copied from the seller when it was posted
        createdAt:
          format: date-time
          type: string
        description:
          type: string
        discountPercent:
          format: int64
          type: integer
        id:
          type: string
        kind:
          enum:
            - bakery
            - prepared_food
            - ingredients
            - drinks
            - mixed_box
            - other
          type: string
        name:
          type: string
        originalPriceVnd:
          format: int64
          type: integer
        photo:
          $ref: "#/components/schemas/OfferPhotoBody"
        priceVnd:
          format: int64
          type: integer
        sellerId:
          type: string
        status:
          description: sold_out and closed are read from the units left and the window
          enum:
            - on_sale
            - sold_out
            - closed
            - withdrawn
          type: string
        unit:
          type: string
        units:
          format: int64
          type: integer
        unitsLeft:
          format: int64
          type: integer
        updatedAt:
          format: date-time
          type: string
        weightGrams:
          format: int64
          type: integer
        windowEnd:
          format: date-time
          type: string
        windowStart:
          format: date-time
          type: string
        withdrawnAt:
          format: date-time
          type: string
      required:
        - id
        - sellerId
        - status
        - name
        - description
        - kind
        - unit
        - units
        - unitsLeft
        - priceVnd
        - originalPriceVnd
        - discountPercent
        - photo
        - windowStart
        - windowEnd
        - collectionPoint
        - createdAt
        - updatedAt
      type: object
    OfferChangeBody:
      additionalProperties: false
      properties:
        description:
          maxLength: 1000
          type: string
        kind:
          enum:
            - bakery
            - prepared_food
            - ingredients
            - drinks
            - mixed_box
            - other
          type: string
        name:
          maxLength: 80
          minLength: 1
          type: string
        originalPriceVnd:
          format: int64
          minimum: 1001
          type: integer
        photoId:
          type: string
        priceVnd:
          format: int64
          minimum: 1000
          type: integer
        unit:
          maxLength: 20
          type: string
        units:
          format: int64
          maximum: 999
          minimum: 1
          type: integer
        weightGrams:
          format: int64
          maximum: 100000
          minimum: 1
          type: integer
        windowEnd:
          format: date-time
          type: string
        windowStart:
          format: date-time
          type: string
      type: object
    OfferDetailsBody:
      additionalProperties: false
      properties:
        description:
          description: Required for a mixed_box, which is described by what it may hold; allergens are written here
          maxLength: 1000
          type: string
        kind:
          enum:
            - bakery
            - prepared_food
            - ingredients
            - drinks
            - mixed_box
            - other
          type: string
        name:
          maxLength: 80
          minLength: 1
          type: string
        originalPriceVnd:
          description: What one unit normally sells for; the price must be the minimum discount below it
          format: int64
          minimum: 1001
          type: integer
        photoId:
          description: From POST /photos, or the photo of an earlier offer of the seller
          type: string
        priceVnd:
          description: Price of one unit, in whole đồng
          format: int64
          minimum: 1000
          type: integer
        unit:
          description: What one unit is called; "suất" when empty
          maxLength: 20
          type: string
        units:
          format: int64
          maximum: 999
          minimum: 1
          type: integer
        weightGrams:
          description: Weight of one unit, to measure food saved
          format: int64
          maximum: 100000
          minimum: 1
          type: integer
        windowEnd:
          description: The last handover
          format: date-time
          type: string
        windowStart:
          description: When the offer is ready to collect
          format: date-time
          type: string
      required:
        - name
        - kind
        - units
        - priceVnd
        - originalPriceVnd
        - photoId
        - windowStart
        - windowEnd
      type: object
    OfferPhotoBody:
      additionalProperties: false
      properties:
        id:
          type: string
        largePath:
          type: string
        smallPath:
          type: string
      required:
        - id
        - largePath
        - smallPath
      type: object
    OfferSellerBody:
      additionalProperties: false
      properties:
        address:
          type: string
        id:
          type: string
        name:
          type: string
        photo:
          $ref: "#/components/schemas/OfferPhotoBody"
      required:
        - id
        - name
        - address
      type: object
    OfferSettingsBody:
      additionalProperties: false
      properties:
        defaultRadiusKm:
          description: The search radius when a customer names none
          format: int64
          maximum: 100
          minimum: 1
          type: integer
        maxRadiusKm:
          format: int64
          maximum: 100
          minimum: 1
          type: integer
        minDiscountPercent:
          description: How far below its original price an offer must be priced
          format: int64
          maximum: 90
          minimum: 0
          type: integer
        startsWithinHours:
          description: How far ahead of posting a window may start
          format: int64
          maximum: 72
          minimum: 1
          type: integer
        updatedAt:
          format: date-time
          readOnly: true
          type: string
        updatedBy:
          readOnly: true
          type: string
        windowMaxMinutes:
          description: The longest collection window
          format: int64
          maximum: 1440
          minimum: 15
          type: integer
        windowMinMinutes:
          description: The shortest collection window
          format: int64
          maximum: 1440
          minimum: 15
          type: integer
      required:
        - minDiscountPercent
        - defaultRadiusKm
        - maxRadiusKm
        - windowMinMinutes
        - windowMaxMinutes
        - startsWithinHours
      type: object
    OffersOutputBody:
      additionalProperties: false
      properties:
        offers:
          items:
            $ref: "#/components/schemas/OfferBody"
          type: array
      required:
        - offers
      type: object
    OrderBody:
      additionalProperties: false
      properties:
        access:
          description: "To its customer: proves the order is theirs without signing in, sent back as Order-Access"
          type: string
        cancelReason:
          type: string
        cancelledAt:
          format: date-time
          type: string
        checkoutId:
          description: Shared by the orders placed together from one cart
          type: string
        collectedAt:
          format: date-time
          type: string
        createdAt:
          format: date-time
          type: string
        customerName:
          description: Who collects, as given with the order
          type: string
        customerPhone:
          description: Their phone number, 0 and nine digits
          type: string
        id:
          type: string
        lines:
          items:
            $ref: "#/components/schemas/OrderLineBody"
          type: array
        number:
          description: What people read aloud, SB- and a number
          type: string
        readyAt:
          format: date-time
          type: string
        refuseNote:
          type: string
        refuseReason:
          enum:
            - not_suitable
            - wrong_items
            - no_answer
            - no_show
            - late
            - sold_out
            - other
          type: string
        refusedAt:
          format: date-time
          type: string
        seller:
          $ref: "#/components/schemas/OrderSellerBody"
          description: Where the order is collected, copied when it was placed
        status:
          description: expired is read from the window's end
          enum:
            - confirmed
            - ready
            - collected
            - cancelled
            - refused
            - expired
          type: string
        totalVnd:
          description: Paid to the seller at the counter
          format: int64
          type: integer
        windowEnd:
          format: date-time
          type: string
        windowStart:
          format: date-time
          type: string
      required:
        - id
        - number
        - status
        - seller
        - lines
        - totalVnd
        - windowStart
        - windowEnd
        - createdAt
        - checkoutId
        - customerName
        - customerPhone
      type: object
    OrderLineBody:
      additionalProperties: false
      properties:
        name:
          type: string
        offerId:
          type: string
        originalPriceVnd:
          format: int64
          type: integer
        photo:
          $ref: "#/components/schemas/OrderLinePhotoBody"
        priceVnd:
          format: int64
          type: integer
        unit:
          type: string
        units:
          format: int64
          type: integer
      required:
        - offerId
        - name
        - unit
        - priceVnd
        - originalPriceVnd
        - units
        - photo
      type: object
    OrderLinePhotoBody:
      additionalProperties: false
      properties:
        id:
          type: string
        largePath:
          type: string
        smallPath:
          type: string
      required:
        - id
        - largePath
        - smallPath
      type: object
    OrderSellerBody:
      additionalProperties: false
      properties:
        address:
          type: string
        id:
          type: string
        latitude:
          format: double
          type: number
        longitude:
          format: double
          type: number
        name:
          type: string
      required:
        - id
        - name
        - address
        - latitude
        - longitude
      type: object
    OrderWantedBody:
      additionalProperties: false
      properties:
        offerId:
          type: string
        units:
          format: int64
          maximum: 999
          minimum: 1
          type: integer
      required:
        - offerId
        - units
      type: object
    OrdersOutputBody:
      additionalProperties: false
      properties:
        orders:
          items:
            $ref: "#/components/schemas/OrderBody"
          type: array
      required:
        - orders
      type: object
    PhotoBody:
      additionalProperties: false
      properties:
        height:
          format: int64
          type: integer
        id:
          type: string
        largePath:
          description: The photo at most 1600 px on its longer side
          type: string
        smallPath:
          description: The photo at most 400 px on its longer side, for lists
          type: string
        width:
          description: Of the photo as uploaded, turned the way it was taken
          format: int64
          type: integer
      required:
        - id
        - width
        - height
        - largePath
        - smallPath
      type: object
    PlaceOrderBody:
      additionalProperties: false
      properties:
        checkoutId:
          description: Shared by the orders placed together from one cart, one per seller; a new one when omitted
          type: string
        lines:
          description: One to ten different offers of one seller
          items:
            $ref: "#/components/schemas/OrderWantedBody"
          maxItems: 10
          minItems: 1
          type:
            - array
            - "null"
        name:
          description: The name the seller calls at the counter
          maxLength: 50
          minLength: 1
          type: string
        phone:
          description: A Vietnamese phone number, 0 and nine digits; spaces, dots, dashes and +84 are accepted
          maxLength: 20
          minLength: 1
          type: string
      required:
        - lines
        - name
        - phone
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          description: Stable machine-readable reason
          type: string
        detail:
          type: string
        errors:
          description: One entry per invalid member or parameter
          items:
            $ref: "#/components/schemas/Violation"
          type:
            - array
            - "null"
        requestId:
          description: The identifier returned in X-Request-Id
          type: string
        status:
          format: int64
          type: integer
        title:
          type: string
        type:
          description: urn:secondbite:failure:<code in kebab case>
          type: string
      required:
        - type
        - title
        - status
        - code
      type: object
    RecordBody:
      additionalProperties: false
      properties:
        createdAt:
          format: date-time
          type: string
        displayName:
          description: Empty until Google gives one or the person sets it
          type: string
        email:
          type: string
        id:
          type: string
        lastSignInMethod:
          description: "How it last signed in: an emailed code or Google"
          enum:
            - code
            - google
          type: string
        lastSignedInAt:
          description: Absent until it signs in
          format: date-time
          type: string
        role:
          enum:
            - customer
            - admin
          type: string
      required:
        - id
        - email
        - role
        - displayName
        - createdAt
      type: object
    RefuseOrderRequest:
      additionalProperties: false
      properties:
        note:
          maxLength: 200
          type: string
        reason:
          enum:
            - not_suitable
            - wrong_items
            - no_answer
            - no_show
            - late
            - sold_out
            - other
          type: string
      required:
        - reason
      type: object
    RejectSellerRequest:
      additionalProperties: false
      properties:
        reason:
          description: What the owner is told, 10 to 500 characters
          maxLength: 500
          minLength: 10
          type: string
      required:
        - reason
      type: object
    RequestCodeInputBody:
      additionalProperties: false
      properties:
        email:
          description: The address to send the code to
          maxLength: 254
          minLength: 3
          type: string
      required:
        - email
      type: object
    RequestCodeOutputBody:
      additionalProperties: false
      properties:
        challengeId:
          description: Send it back with the code
          type: string
        expiresAt:
          format: date-time
          type: string
      required:
        - challengeId
        - expiresAt
      type: object
    RoleCountsBody:
      additionalProperties: false
      properties:
        admin:
          format: int64
          type: integer
        customer:
          format: int64
          type: integer
      required:
        - customer
        - admin
      type: object
    SaveEmailSettingsInputBody:
      additionalProperties: false
      properties:
        brevoApiKey:
          description: Empty keeps the stored key
          maxLength: 1024
          type: string
        provider:
          enum:
            - smtp
            - brevo
          type: string
        senderAddress:
          format: email
          maxLength: 254
          type: string
        senderName:
          maxLength: 100
          minLength: 1
          type: string
        smtpHost:
          maxLength: 253
          type: string
        smtpPassword:
          description: Empty keeps the stored password
          maxLength: 1024
          type: string
        smtpPort:
          format: int64
          maximum: 65535
          minimum: 0
          type: integer
        smtpSecurity:
          enum:
            - starttls
            - tls
            - none
          type: string
        smtpUsername:
          maxLength: 254
          type: string
      required:
        - provider
        - senderAddress
        - senderName
      type: object
    SellerBody:
      additionalProperties: false
      properties:
        address:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        latitude:
          format: double
          type: number
        longitude:
          format: double
          type: number
        myRole:
          description: The caller's role; absent for an admin who is not a member
          enum:
            - owner
            - staff
          type: string
        name:
          type: string
        phone:
          type: string
        photoId:
          description: Served at /photos/{photoId}/1600.jpg and /400.jpg
          type: string
        status:
          enum:
            - pending
            - active
            - rejected
            - blocked
          type: string
        statusChangedAt:
          format: date-time
          type: string
        statusReason:
          description: Why an admin rejected or blocked the seller, as the owner is told
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - address
        - latitude
        - longitude
        - phone
        - status
        - createdAt
        - updatedAt
      type: object
    SellerPhotoBody:
      additionalProperties: false
      properties:
        id:
          type: string
        largePath:
          type: string
        smallPath:
          type: string
      required:
        - id
        - largePath
        - smallPath
      type: object
    SellerProfileBody:
      additionalProperties: false
      properties:
        address:
          type: string
        id:
          type: string
        latitude:
          format: double
          type: number
        longitude:
          format: double
          type: number
        name:
          type: string
        photo:
          $ref: "#/components/schemas/SellerPhotoBody"
      required:
        - id
        - name
        - address
        - latitude
        - longitude
      type: object
    SellersOutputBody:
      additionalProperties: false
      properties:
        sellers:
          items:
            $ref: "#/components/schemas/SellerBody"
          type:
            - array
            - "null"
      required:
        - sellers
      type: object
    SendTestEmailInputBody:
      additionalProperties: false
      properties:
        to:
          description: Who receives it; the admin sending it when empty
          format: email
          maxLength: 254
          type: string
      type: object
    SessionOutputBody:
      additionalProperties: false
      properties:
        account:
          $ref: "#/components/schemas/AccountBody"
        expiresAt:
          description: The session ends then unless it is used; each use moves the end 30 days on
          format: date-time
          type: string
        token:
          description: "Send it as Authorization: Bearer <token>; it is shown only now, and not when the cookie was asked for"
          type: string
      required:
        - expiresAt
        - account
      type: object
    SetDisplayNameInputBody:
      additionalProperties: false
      properties:
        displayName:
          description: 1 to 50 characters once trimmed; Google never replaces it
          maxLength: 200
          type: string
      required:
        - displayName
      type: object
    SetSellerPhotoRequest:
      additionalProperties: false
      properties:
        photoId:
          description: From POST /photos
          type: string
      required:
        - photoId
      type: object
    SignInInputBody:
      additionalProperties: false
      properties:
        challengeId:
          type: string
        code:
          description: The six digits of the email
          pattern: ^[0-9]{6}$
          type: string
        session:
          default: token
          description: "token: the token in the body (the mobile application); cookie: the session cookie instead (the web)"
          enum:
            - token
            - cookie
          type: string
      required:
        - challengeId
        - code
      type: object
    StatusCountsBody:
      additionalProperties: false
      properties:
        active:
          format: int64
          type: integer
        blocked:
          format: int64
          type: integer
        pending:
          format: int64
          type: integer
        rejected:
          format: int64
          type: integer
      required:
        - pending
        - active
        - rejected
        - blocked
      type: object
    StatusDayBody:
      additionalProperties: false
      properties:
        active:
          format: int64
          type: integer
        blocked:
          format: int64
          type: integer
        day:
          description: The day in Vietnam, as YYYY-MM-DD
          format: date
          type: string
        pending:
          format: int64
          type: integer
        rejected:
          format: int64
          type: integer
      required:
        - day
        - pending
        - active
        - rejected
        - blocked
      type: object
    Violation:
      additionalProperties: false
      properties:
        code:
          type: string
        detail:
          type: string
        parameter:
          description: The invalid parameter, for example query.limit
          type: string
        pointer:
          description: "JSON Pointer to the body member, for example #/priceVnd"
          type: string
      required:
        - detail
        - code
      type: object
  securitySchemes:
    bearer:
      description: A session token from POST /auth/sessions.
      scheme: bearer
      type: http
    cookie:
      description: "The web's session, set by signing in with \"session\": \"cookie\"."
      in: cookie
      name: secondbite_session
      type: apiKey
info:
  description: The API of Second Bite, a non-profit marketplace for food surplus.
  title: Second Bite API
  version: 0.1.0
openapi: 3.1.0
paths:
  /accounts/me:
    get:
      operationId: getMyAccount
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: The signed-in account
      tags:
        - Accounts
    put:
      description: Trimmed, it holds 1 to 50 characters and no control character. Google's sign-in fills a name only while it is empty, so the chosen one stays.
      operationId: setMyDisplayName
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDisplayNameInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: Set the signed-in account's display name
      tags:
        - Accounts
  /accounts/me/deletion:
    post:
      description: Deletes the account, its sessions, its Google link and the codes and emails sent to its address at once; its memberships of sellers and the photos it uploaded that nothing uses follow within minutes. A seller the account owned is blocked. The session cookie is cleared.
      operationId: deleteMyAccount
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountInputBody"
        required: true
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                description: Clears the session cookie
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: Delete the signed-in account with the emailed code
      tags:
        - Accounts
  /accounts/me/deletion-codes:
    post:
      description: The code confirms the deletion only; it cannot sign in. It shares the address's limits with the sign-in codes.
      operationId: requestAccountDeletionCode
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestCodeOutputBody"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: Email the signed-in account's address a code that confirms its deletion
      tags:
        - Accounts
  /admin/accounts:
    get:
      description: q matches the address or the name, Vietnamese marks ignored. Sorted by last sign-in, those never signed in come last. A page past the end is empty.
      operationId: listAccounts
      parameters:
        - description: Keep this role; every role when absent
          explode: false
          in: query
          name: role
          schema:
            description: Keep this role; every role when absent
            enum:
              - customer
              - admin
            type: string
        - description: Words of the address or the name
          explode: false
          in: query
          name: q
          schema:
            description: Words of the address or the name
            maxLength: 100
            type: string
        - description: name, created or signedIn; a leading - is descending; the newest first when absent
          explode: false
          in: query
          name: sort
          schema:
            description: name, created or signedIn; a leading - is descending; the newest first when absent
            enum:
              - name
              - -name
              - created
              - -created
              - signedIn
              - -signedIn
            type: string
        - explode: false
          in: query
          name: page
          schema:
            default: 1
            format: int64
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: size
          schema:
            default: 25
            format: int64
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccountsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: Accounts by role and words, the newest first
      tags:
        - Admin
  /admin/accounts/{accountId}:
    get:
      operationId: getAccountForAdmins
      parameters:
        - in: path
          name: accountId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecordBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: An account, with when and how it last signed in
      tags:
        - Admin
  /admin/accounts/{accountId}/orders:
    get:
      operationId: getAccountOrderHistory
      parameters:
        - in: path
          name: accountId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: "What an account ordered: counts and the latest five orders"
      tags:
        - Admin
  /admin/admins:
    get:
      operationId: listAdmins
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: Every admin, by address
      tags:
        - Admin
    post:
      description: Creates the account when the address has never signed in; its owner signs in with an emailed code. Granting an admin again changes nothing.
      operationId: grantAdmin
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantAdminRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: Make the account of an address an admin
      tags:
        - Admin
  /admin/admins/{accountId}/revoke:
    post:
      description: The account's next request is a customer's; its sessions stay. Revoking a customer changes nothing.
      operationId: revokeAdmin
      parameters:
        - in: path
          name: accountId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: Make an admin a customer again; never oneself nor the last admin
      tags:
        - Admin
  /admin/audit-events:
    get:
      description: Only the actions of the audit catalog are recorded. A page past the end is empty.
      operationId: listAuditEvents
      parameters:
        - description: Keep these actions; every action when absent
          explode: false
          in: query
          name: action
          schema:
            description: Keep these actions; every action when absent
            items:
              enum:
                - offer_settings.change
                - email_settings.change
                - admin.grant
                - admin.revoke
                - seller.approve
                - seller.reject
                - seller.block
                - seller.unblock
              type: string
            type:
              - array
              - "null"
        - description: Keep one admin's actions
          explode: false
          in: query
          name: actorId
          schema:
            description: Keep one admin's actions
            type: string
        - description: Keep what happened at or after this time
          explode: false
          in: query
          name: since
          schema:
            description: Keep what happened at or after this time
            format: date-time
            type: string
        - description: Keep what happened before this time
          explode: false
          in: query
          name: until
          schema:
            description: Keep what happened before this time
            format: date-time
            type: string
        - description: Words of the admin's or the resource's label, or the resource's identifier
          explode: false
          in: query
          name: q
          schema:
            description: Words of the admin's or the resource's label, or the resource's identifier
            maxLength: 100
            type: string
        - explode: false
          in: query
          name: page
          schema:
            default: 1
            format: int64
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: size
          schema:
            default: 25
            format: int64
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: What admins did, the latest first
      tags:
        - Admin
  /admin/email-settings:
    get:
      operationId: getEmailSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSettingsBody"
          description: OK
          headers:
            ETag:
              schema:
                description: The settings' version, sent back in If-Match to save them
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: Read who delivers email
      tags:
        - Admin
    put:
      description: "If-Match carries the ETag read, or If-None-Match: * saves the first settings; when someone saved since, the answer is 412 and nothing changes. Without either the answer is 400."
      operationId: saveEmailSettings
      parameters:
        - description: The ETag of the settings read
          in: header
          name: If-Match
          schema:
            description: The ETag of the settings read
            type: string
        - description: "* to save the first settings, when none were read"
          in: header
          name: If-None-Match
          schema:
            description: "* to save the first settings, when none were read"
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveEmailSettingsInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: Choose who delivers email; the next email uses it
      tags:
        - Admin
  /admin/email-settings/test:
    post:
      operationId: sendTestEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendTestEmailInputBody"
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: Send one email through the settings saved, to an address or to oneself
      tags:
        - Admin
  /admin/memberships:
    get:
      operationId: listMembershipsForAdmins
      parameters:
        - description: The accounts, at most 100
          explode: false
          in: query
          name: accountId
          required: true
          schema:
            description: The accounts, at most 100
            items:
              type: string
            maxItems: 100
            minItems: 1
            type:
              - array
              - "null"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MembershipsOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: The sellers some accounts own or work at, owners first
      tags:
        - Admin
  /admin/offer-settings:
    get:
      operationId: getOfferSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferSettingsBody"
          description: OK
          headers:
            ETag:
              schema:
                description: The settings' version, sent back in If-Match to save them
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
        - cookie: []
      summary: The rules every offer follows
      tags:
        - Admin
    put:
      description: New rules apply to offers posted, and to the prices and windows changed, after they are saved. If-Match carries the ETag read; when someone saved since, the answer is 412 and nothing changes.
      operationId: saveOfferSettings
      parameters:
        - description: The ETag of the settings read
          in: header
