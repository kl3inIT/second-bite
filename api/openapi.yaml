components:
  schemas:
    AccountBody:
      additionalProperties: false
      properties:
        email:
          type: string
        id:
          type: string
        role:
          enum:
            - customer
            - admin
          type: string
      required:
        - id
        - email
        - role
      type: object
    AddSellerStaffRequest:
      additionalProperties: false
      properties:
        email:
          maxLength: 254
          minLength: 3
          type: string
      required:
        - email
      type: object
    CollectionPointBody:
      additionalProperties: false
      properties:
        address:
          type: string
        latitude:
          format: double
          type: number
        longitude:
          format: double
          type: number
      required:
        - latitude
        - longitude
        - address
      type: object
    DetailsBody:
      additionalProperties: false
      properties:
        address:
          description: The address as people write it
          maxLength: 300
          minLength: 1
          type: string
        latitude:
          description: Where the seller is, pinned on a map
          format: double
          maximum: 90
          minimum: -90
          type: number
        longitude:
          format: double
          maximum: 180
          minimum: -180
          type: number
        name:
          maxLength: 100
          minLength: 1
          type: string
        phone:
          description: Shown to the seller's members and admins
          maxLength: 30
          minLength: 9
          type: string
      required:
        - name
        - address
        - latitude
        - longitude
        - phone
      type: object
    EmailSettingsBody:
      additionalProperties: false
      properties:
        brevoApiKeySet:
          description: Whether a Brevo API key is stored; it is never returned
          type: boolean
        provider:
          enum:
            - smtp
            - brevo
          type: string
        senderAddress:
          format: email
          maxLength: 254
          type: string
        senderName:
          maxLength: 100
          type: string
        smtpHost:
          maxLength: 253
          type: string
        smtpPasswordSet:
          description: Whether an SMTP password is stored; it is never returned
          type: boolean
        smtpPort:
          format: int64
          maximum: 65535
          minimum: 0
          type: integer
        smtpSecurity:
          enum:
            - starttls
            - tls
            - none
          type: string
        smtpUsername:
          maxLength: 254
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - provider
        - senderAddress
        - senderName
        - smtpHost
        - smtpPort
        - smtpSecurity
        - smtpUsername
        - smtpPasswordSet
        - brevoApiKeySet
        - updatedAt
      type: object
    MemberBody:
      additionalProperties: false
      properties:
        accountId:
          type: string
        addedAt:
          format: date-time
          type: string
        email:
          type: string
        role:
          enum:
            - owner
            - staff
          type: string
      required:
        - accountId
        - email
        - role
        - addedAt
      type: object
    MembersOutputBody:
      additionalProperties: false
      properties:
        members:
          items:
            $ref: "#/components/schemas/MemberBody"
          type:
            - array
            - "null"
      required:
        - members
      type: object
    OfferBody:
      additionalProperties: false
      properties:
        collectionPoint:
          $ref: "#/components/schemas/CollectionPointBody"
          description: Where the offer is collected, copied from the seller when it was posted
        createdAt:
          format: date-time
          type: string
        description:
          type: string
        discountPercent:
          format: int64
          type: integer
        id:
          type: string
        kind:
          enum:
            - bakery
            - prepared_food
            - ingredients
            - drinks
            - mixed_box
            - other
          type: string
        name:
          type: string
        originalPriceVnd:
          format: int64
          type: integer
        photo:
          $ref: "#/components/schemas/OfferPhotoBody"
        priceVnd:
          format: int64
          type: integer
        sellerId:
          type: string
        status:
          description: sold_out and closed are read from the units left and the window
          enum:
            - on_sale
            - sold_out
            - closed
            - withdrawn
          type: string
        unit:
          type: string
        units:
          format: int64
          type: integer
        unitsLeft:
          format: int64
          type: integer
        updatedAt:
          format: date-time
          type: string
        weightGrams:
          format: int64
          type: integer
        windowEnd:
          format: date-time
          type: string
        windowStart:
          format: date-time
          type: string
        withdrawnAt:
          format: date-time
          type: string
      required:
        - id
        - sellerId
        - status
        - name
        - description
        - kind
        - unit
        - units
        - unitsLeft
        - priceVnd
        - originalPriceVnd
        - discountPercent
        - photo
        - windowStart
        - windowEnd
        - collectionPoint
        - createdAt
        - updatedAt
      type: object
    OfferChangeBody:
      additionalProperties: false
      properties:
        description:
          maxLength: 1000
          type: string
        kind:
          enum:
            - bakery
            - prepared_food
            - ingredients
            - drinks
            - mixed_box
            - other
          type: string
        name:
          maxLength: 80
          minLength: 1
          type: string
        originalPriceVnd:
          format: int64
          minimum: 1001
          type: integer
        photoId:
          type: string
        priceVnd:
          format: int64
          minimum: 1000
          type: integer
        unit:
          maxLength: 20
          type: string
        units:
          format: int64
          maximum: 999
          minimum: 1
          type: integer
        weightGrams:
          format: int64
          maximum: 100000
          minimum: 1
          type: integer
        windowEnd:
          format: date-time
          type: string
        windowStart:
          format: date-time
          type: string
      type: object
    OfferDetailsBody:
      additionalProperties: false
      properties:
        description:
          description: Required for a mixed_box, which is described by what it may hold; allergens are written here
          maxLength: 1000
          type: string
        kind:
          enum:
            - bakery
            - prepared_food
            - ingredients
            - drinks
            - mixed_box
            - other
          type: string
        name:
          maxLength: 80
          minLength: 1
          type: string
        originalPriceVnd:
          description: What one unit normally sells for; the price must be the minimum discount below it
          format: int64
          minimum: 1001
          type: integer
        photoId:
          description: From POST /photos, or the photo of an earlier offer of the seller
          type: string
        priceVnd:
          description: Price of one unit, in whole đồng
          format: int64
          minimum: 1000
          type: integer
        unit:
          description: What one unit is called; "suất" when empty
          maxLength: 20
          type: string
        units:
          format: int64
          maximum: 999
          minimum: 1
          type: integer
        weightGrams:
          description: Weight of one unit, to measure food saved
          format: int64
          maximum: 100000
          minimum: 1
          type: integer
        windowEnd:
          description: The last handover
          format: date-time
          type: string
        windowStart:
          description: When the offer is ready to collect
          format: date-time
          type: string
      required:
        - name
        - kind
        - units
        - priceVnd
        - originalPriceVnd
        - photoId
        - windowStart
        - windowEnd
      type: object
    OfferPhotoBody:
      additionalProperties: false
      properties:
        id:
          type: string
        largePath:
          type: string
        smallPath:
          type: string
      required:
        - id
        - largePath
        - smallPath
      type: object
    OfferSettingsBody:
      additionalProperties: false
      properties:
        defaultRadiusKm:
          description: The search radius when a customer names none
          format: int64
          maximum: 100
          minimum: 1
          type: integer
        maxRadiusKm:
          format: int64
          maximum: 100
          minimum: 1
          type: integer
        minDiscountPercent:
          description: How far below its original price an offer must be priced
          format: int64
          maximum: 90
          minimum: 0
          type: integer
        startsWithinHours:
          description: How far ahead of posting a window may start
          format: int64
          maximum: 72
          minimum: 1
          type: integer
        updatedAt:
          format: date-time
          readOnly: true
          type: string
        updatedBy:
          readOnly: true
          type: string
        windowMaxMinutes:
          description: The longest collection window
          format: int64
          maximum: 1440
          minimum: 15
          type: integer
        windowMinMinutes:
          description: The shortest collection window
          format: int64
          maximum: 1440
          minimum: 15
          type: integer
      required:
        - minDiscountPercent
        - defaultRadiusKm
        - maxRadiusKm
        - windowMinMinutes
        - windowMaxMinutes
        - startsWithinHours
      type: object
    OffersOutputBody:
      additionalProperties: false
      properties:
        offers:
          items:
            $ref: "#/components/schemas/OfferBody"
          type:
            - array
            - "null"
      required:
        - offers
      type: object
    PhotoBody:
      additionalProperties: false
      properties:
        height:
          format: int64
          type: integer
        id:
          type: string
        largePath:
          description: The photo at most 1600 px on its longer side
          type: string
        smallPath:
          description: The photo at most 400 px on its longer side, for lists
          type: string
        width:
          description: Of the photo as uploaded, turned the way it was taken
          format: int64
          type: integer
      required:
        - id
        - width
        - height
        - largePath
        - smallPath
      type: object
    Problem:
      additionalProperties: false
      properties:
        code:
          description: Stable machine-readable reason
          type: string
        detail:
          type: string
        errors:
          description: One entry per invalid member or parameter
          items:
            $ref: "#/components/schemas/Violation"
          type:
            - array
            - "null"
        requestId:
          description: The identifier returned in X-Request-Id
          type: string
        status:
          format: int64
          type: integer
        title:
          type: string
        type:
          description: urn:secondbite:failure:<code in kebab case>
          type: string
      required:
        - type
        - title
        - status
        - code
      type: object
    RequestCodeInputBody:
      additionalProperties: false
      properties:
        email:
          description: The address to send the code to
          maxLength: 254
          minLength: 3
          type: string
      required:
        - email
      type: object
    RequestCodeOutputBody:
      additionalProperties: false
      properties:
        challengeId:
          description: Send it back with the code
          type: string
        expiresAt:
          format: date-time
          type: string
      required:
        - challengeId
        - expiresAt
      type: object
    SaveEmailSettingsInputBody:
      additionalProperties: false
      properties:
        brevoApiKey:
          description: Empty keeps the stored key
          maxLength: 1024
          type: string
        provider:
          enum:
            - smtp
            - brevo
          type: string
        senderAddress:
          format: email
          maxLength: 254
          type: string
        senderName:
          maxLength: 100
          minLength: 1
          type: string
        smtpHost:
          maxLength: 253
          type: string
        smtpPassword:
          description: Empty keeps the stored password
          maxLength: 1024
          type: string
        smtpPort:
          format: int64
          maximum: 65535
          minimum: 0
          type: integer
        smtpSecurity:
          enum:
            - starttls
            - tls
            - none
          type: string
        smtpUsername:
          maxLength: 254
          type: string
      required:
        - provider
        - senderAddress
        - senderName
      type: object
    SellerBody:
      additionalProperties: false
      properties:
        address:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        latitude:
          format: double
          type: number
        longitude:
          format: double
          type: number
        myRole:
          description: The caller's role; absent for an admin who is not a member
          enum:
            - owner
            - staff
          type: string
        name:
          type: string
        phone:
          type: string
        photoId:
          description: Served at /photos/{photoId}/1600.jpg and /400.jpg
          type: string
        status:
          enum:
            - pending
            - active
            - blocked
          type: string
        statusChangedAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - address
        - latitude
        - longitude
        - phone
        - status
        - createdAt
        - updatedAt
      type: object
    SellersOutputBody:
      additionalProperties: false
      properties:
        sellers:
          items:
            $ref: "#/components/schemas/SellerBody"
          type:
            - array
            - "null"
      required:
        - sellers
      type: object
    SessionOutputBody:
      additionalProperties: false
      properties:
        account:
          $ref: "#/components/schemas/AccountBody"
        expiresAt:
          description: The session ends then unless it is used; each use moves the end 30 days on
          format: date-time
          type: string
        token:
          description: "Send it as Authorization: Bearer <token>; it is shown only now"
          type: string
      required:
        - token
        - expiresAt
        - account
      type: object
    SetSellerPhotoRequest:
      additionalProperties: false
      properties:
        photoId:
          description: From POST /photos
          type: string
      required:
        - photoId
      type: object
    SignInInputBody:
      additionalProperties: false
      properties:
        challengeId:
          type: string
        code:
          description: The six digits of the email
          pattern: ^[0-9]{6}$
          type: string
      required:
        - challengeId
        - code
      type: object
    Violation:
      additionalProperties: false
      properties:
        code:
          type: string
        detail:
          type: string
        parameter:
          description: The invalid parameter, for example query.limit
          type: string
        pointer:
          description: "JSON Pointer to the body member, for example #/priceVnd"
          type: string
      required:
        - detail
        - code
      type: object
  securitySchemes:
    bearer:
      description: A session token from POST /auth/sessions.
      scheme: bearer
      type: http
info:
  description: The API of Second Bite, a non-profit marketplace for food surplus.
  title: Second Bite API
  version: 0.1.0
openapi: 3.1.0
paths:
  /accounts/me:
    get:
      operationId: getMyAccount
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
      summary: The signed-in account
      tags:
        - Accounts
  /admin/email-settings:
    get:
      operationId: getEmailSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailSettingsBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
      summary: Read who delivers email
      tags:
        - Admins
    put:
      operationId: saveEmailSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveEmailSettingsInputBody"
        required: true
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
      summary: Choose who delivers email; the next email uses it
      tags:
        - Admins
  /admin/offer-settings:
    get:
      operationId: getOfferSettings
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferSettingsBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
      summary: The rules every offer follows
      tags:
        - Admin
    put:
      description: New rules apply to offers posted, and to the prices and windows changed, after they are saved.
      operationId: saveOfferSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferSettingsBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferSettingsBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
      summary: Change the rules every offer follows
      tags:
        - Admin
  /admin/sellers:
    get:
      operationId: listSellersForAdmins
      parameters:
        - explode: false
          in: query
          name: status
          schema:
            default: pending
            enum:
              - pending
              - active
              - blocked
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 100
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            default: 0
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellersOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
      summary: Sellers in a status, oldest first
      tags:
        - Admin
  /admin/sellers/{sellerId}/activate:
    post:
      operationId: activateSeller
      parameters:
        - in: path
          name: sellerId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
      summary: Let a seller publish; also lifts a block
      tags:
        - Admin
  /admin/sellers/{sellerId}/block:
    post:
      operationId: blockSeller
      parameters:
        - in: path
          name: sellerId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
      summary: Stop a seller from publishing
      tags:
        - Admin
  /auth/sessions:
    post:
      description: Creates the account on its first sign-in.
      operationId: signIn
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInInputBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionOutputBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Sign in with the emailed code
      tags:
        - Sign-in
  /auth/sessions/current:
    delete:
      operationId: signOut
      responses:
        "204":
          description: No Content
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
      summary: "Sign out: end the session of this token"
      tags:
        - Sign-in
  /auth/sign-in-codes:
    post:
      description: The answer is the same whether or not the address has an account.
      operationId: requestSignInCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestCodeInputBody"
        required: true
      responses:
        "202":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestCodeOutputBody"
          description: Accepted
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: Email a six-digit sign-in code
      tags:
        - Sign-in
  /offers/{offerId}:
    get:
      description: Anyone reads an offer while its window is open and it is not withdrawn; its seller's people read it always.
      operationId: getOffer
      parameters:
        - in: path
          name: offerId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - {}
        - bearer: []
      summary: An offer
      tags:
        - Offers
    patch:
      description: Once units are ordered, only the description, the photo and the units (never below those ordered) change.
      operationId: changeOffer
      parameters:
        - in: path
          name: offerId
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferChangeBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
      summary: Change an offer
      tags:
        - Offers
  /offers/{offerId}/withdraw:
    post:
      operationId: withdrawOffer
      parameters:
        - in: path
          name: offerId
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OfferBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
      summary: Take an offer off sale for good
      tags:
        - Offers
  /photos:
    post:
      description: "The body is the image itself: JPEG, PNG or WebP, at most 10 MB. It is written again as JPEG in two sizes, without its metadata. An unused photo is kept for a day."
      operationId: uploadPhoto
      requestBody:
        content:
          image/*:
            schema:
              contentMediaType: application/octet-stream
              format: binary
              type: string
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoBody"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - bearer: []
      summary: Upload a photo for an offer or a seller
      tags:
        - Photos
  /photos/{photoId}/{file}:
    get:
      operationId: getPhoto
      parameters:
        - in: path
          name: photoId
          required: true
          schema:
            type: string
        - in: path
          name: file
          required: true
          schema:
            enum:
              - 1600.jpg
              - 400.jpg
            type: string
      responses:
        "200":
          content:
            image/jpeg: {}
          description: The photo as JPEG
          headers:
            Cache-Control:
              schema:
                type: string
            Content-Security-Policy:
              schema:
                type: string
            Content-Type:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      summary: A photo in one of its sizes
      tags:
        - Photos
  /sellers:
    post:
      operationId: openSeller
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DetailsBody"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SellerBody"
          description: Created
        default:
          content:
