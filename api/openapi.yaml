  /offers:
    get:
      description: Anyone may search. Offers sold out are included unless available is set; those withdrawn, over or of a blocked seller never are.
      operationId: searchOffers
      parameters:
        - description: latitude,longitude, such as 21.0565,105.8964
          explode: false
          in: query
          name: near
          schema:
            description: latitude,longitude, such as 21.0565,105.8964
            pattern: ^-?[0-9]+(\.[0-9]+)?,-?[0-9]+(\.[0-9]+)?$
            type: string
        - description: Around near; the settings' default when absent, never more than their maximum
          explode: false
          in: query
          name: radiusKm
          schema:
            description: Around near; the settings' default when absent, never more than their maximum
            format: int64
            maximum: 100
            minimum: 0
            type: integer
        - description: Words; typed without marks they match any marks ("ca" finds cá and cà), with marks only those
          explode: false
          in: query
          name: q
          schema:
            description: Words; typed without marks they match any marks ("ca" finds cá and cà), with marks only those
            maxLength: 200
            type: string
        - description: One or more kinds, comma-separated
          explode: false
          in: query
          name: kind
          schema:
            description: One or more kinds, comma-separated
            items:
              enum:
                - bakery
                - prepared_food
                - ingredients
                - drinks
                - mixed_box
                - other
              type: string
            type:
              - array
              - "null"
        - description: The lowest price of one unit, in đồng
          explode: false
          in: query
          name: minPrice
          schema:
            description: The lowest price of one unit, in đồng
            format: int64
            minimum: 0
            type: integer
        - description: The highest price of one unit, in đồng
          explode: false
          in: query
          name: maxPrice
          schema:
            description: The highest price of one unit, in đồng
            format: int64
            minimum: 0
            type: integer
        - description: Keep offers whose window overlaps collectFrom to collectTo; both at one moment keep what can be collected then
          explode: false
          in: query
          name: collectFrom
          schema:
            description: Keep offers whose window overlaps collectFrom to collectTo; both at one moment keep what can be collected then
            format: date-time
            type: string
        - explode: false
          in: query
          name: collectTo
          schema:
            format: date-time
            type: string
        - description: One seller's offers
          explode: false
          in: query
          name: sellerId
          schema:
            description: One seller's offers
            type: string
        - description: Leave out what has sold out
          explode: false
          in: query
          name: available
          schema:
            description: Leave out what has sold out
            type: boolean
        - description: relevance with q, distance with near, ending_soon otherwise, when absent
          explode: false
          in: query
          name: sort
          schema:
            description: relevance with q, distance with near, ending_soon otherwise, when absent
            enum:
              - relevance
              - distance
              - ending_soon
              - price
              - discount
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 20
            format: int64
            maximum: 50
            minimum: 1
            type: integer
        - explode: false
          in: query
          name: offset
          schema:
            default: 0
            format: int64
            minimum: 0
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FoundOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Error
      security:
        - {}
        - bearer: []
        - cookie: []
      summary: Find offers on sale or sold out, near a point, by words and filters
      tags:
        - Offers
