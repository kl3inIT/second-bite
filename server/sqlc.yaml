# Each module's queries become typed Go in a package under the module's own
# internal/, which no other module may import. Regenerate with
# `go tool sqlc generate`; CI fails when the generated code is out of date.
version: "2"
overrides:
  go:
    overrides:
      - db_type: uuid
        go_type: github.com/google/uuid.UUID
      - db_type: uuid
        nullable: true
        go_type:
          import: github.com/google/uuid
          type: NullUUID
      - db_type: timestamptz
        go_type: time.Time
      - db_type: timestamptz
        nullable: true
        go_type:
          type: time.Time
          pointer: true
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/notification/queries.sql
    gen:
      go:
        package: db
        out: internal/notification/internal/db
        sql_package: pgx/v5
        omit_unused_structs: true
  - engine: postgresql
    schema: migrations
    queries: internal/identity/queries.sql
    gen:
      go:
        package: db
        out: internal/identity/internal/db
        sql_package: pgx/v5
        omit_unused_structs: true
  - engine: postgresql
    schema: migrations
    queries: internal/seller/queries.sql
    gen:
      go:
        package: db
        out: internal/seller/internal/db
        sql_package: pgx/v5
        omit_unused_structs: true
  - engine: postgresql
    schema: migrations
    queries: internal/file/queries.sql
    gen:
      go:
        package: db
        out: internal/file/internal/db
        sql_package: pgx/v5
        omit_unused_structs: true
  - engine: postgresql
    schema: migrations
    queries: internal/offer/queries.sql
    gen:
      go:
        package: db
        out: internal/offer/internal/db
        sql_package: pgx/v5
        omit_unused_structs: true
  - engine: postgresql
    schema: migrations
    queries: internal/audit/queries.sql
    gen:
      go:
        package: db
        out: internal/audit/internal/db
        sql_package: pgx/v5
        omit_unused_structs: true
  - engine: postgresql
    schema: migrations
    queries: internal/order/queries.sql
    gen:
      go:
        package: db
        out: internal/order/internal/db
        sql_package: pgx/v5
        omit_unused_structs: true
